<script>
/*TL*/
// M18 «Alqış» 2D (11-15): əvvəl gülürlər → sonra unudurlar → zirvədə alqışlayırlar. «Same people. Different view.»
// Mühərrik M17 «Yol» 2D-dən (əsas format). Yenilik: izdiham (5 siluet, güzgü/ölçü/saç variantları), şəfəq səması, günəş rim işığı, telefon işığı, söz baloncukları.
// Yan görünüş: silsilənin profili = qrafik. İnsan siluetləri (profil üz, bədən forması, çəkmə, çanta), IK yeriş (ayaq sürüşmür),
// fənər/lampa/ay işığından kənar işığı (rim light), qat-qat dağlar, dənə, vinyet. window.draw(t) — t-nin saf funksiyası.
const T = window.TL, W = 1080, H = 1920;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA';

// ---------------- silsilə = qrafik ----------------
function monotone(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; } const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; } }
  return x => { if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1]; let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1]; };
}
const P = monotone(T.ridge);
const G = x => P(x);                 // yerin hündürlüyü (m)
const slopeA = x => Math.atan2(G(x + .15) - G(x - .15), .3);
const XS = T.xs, xsAt = t => { if (t <= XS[0][0]) return XS[0][1]; for (let i = 0; i < XS.length - 1; i++) if (t <= XS[i + 1][0]) return lerp(XS[i][1], XS[i + 1][1], (t - XS[i][0]) / (XS[i + 1][0] - XS[i][0])); return XS[XS.length - 1][1]; };
const shotAt = t => T.shots.find(s => t >= s[1] && t < s[2]) || T.shots[T.shots.length - 1];
const dayAt = t => { const D = T.days; if (t <= D[0][0]) return D[0][1]; for (let i = 0; i < D.length - 1; i++) if (t <= D[i + 1][0]) return Math.round(lerp(D[i][1], D[i + 1][1], (t - D[i][0]) / (D[i + 1][0] - D[i][0]))); return D[D.length - 1][1]; };
const SCORE_K = T.score / (G(T.xend) - G(0)), scoreAt = x => Math.round((G(x) - G(0)) * SCORE_K);
const PEAK = [T.peak, G(T.peak) + 2.2];
const DESK = { x: -2.05 }, STOOL = -2.88;

// ---------------- kamera ----------------
let C = { cx: 0, cy: 0, s: 100 }, F = null;
const sx = x => W / 2 + (x - C.cx) * C.s, sy = y => H / 2 - (y - C.cy) * C.s, S = p => [sx(p[0]), sy(p[1])];
const fx = x => F.ax + x * F.s, fy = y => F.ay - y * F.s;

// ---------------- hazır teksturalar ----------------
const NOISE = [0, 1, 2, 3].map(k => { const c = mk(540, 960), x = c.getContext('2d'), d = x.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R(i * .37 + k * 91.3) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
const ROCKTEX = (() => { const c = mk(256, 256), x = c.getContext('2d'), d = x.createImageData(256, 256);
  for (let j = 0; j < 256; j++) for (let i = 0; i < 256; i++) { const k = (j * 256 + i) * 4, v = 120 + (R(i * 13.1 + j * 7.7) - .5) * 70 + 30 * Math.sin(i * .09 + Math.sin(j * .05) * 3); d.data[k] = d.data[k + 1] = d.data[k + 2] = v; d.data[k + 3] = 255; }
  x.putImageData(d, 0, 0); return c; })();
const ROCKPAT = X.createPattern(ROCKTEX, 'repeat');
const STARS = Array.from({ length: 420 }, (_, i) => [R(i * 3 + 1) * W, Math.pow(R(i * 3 + 2), 1.4) * H * .62, .4 + Math.pow(R(i * 3 + 3), 6) * 2.2, R(i + 77)]);
const ROCKS = []; for (let i = 0; i < 420; i++) { const x = -40 + i * .42 + R(i) * .3; if (x > -7.2 && x < -1.6) continue; ROCKS.push({ x, w: .1 + Math.pow(R(i + 7), 3) * .75, h: .05 + Math.pow(R(i + 3), 2.2) * .32, k: i }); }
const FGROCK = (() => { const c = mk(520, 340), x = c.getContext('2d'); x.filter = 'blur(10px)'; x.fillStyle = '#030304'; x.beginPath(); x.ellipse(260, 300, 220, 160, 0, 0, 7); x.fill(); return c; })();
const paperCv = mk(600, 420);
let paperVer = -1;
function drawPaper(v) {
  if (v === paperVer) return; paperVer = v; const x = paperCv.getContext('2d'), w = 600, h = 420;
  let g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#f1ead8'); g.addColorStop(1, '#dcd3bf'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(70,110,160,.22)'; x.lineWidth = 1.5; for (let i = 0; i <= w; i += 30) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); } for (let j = 0; j <= h; j += 30) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
  for (let k = Math.max(1, v - 4); k <= v; k++) { const cur = k === v; x.strokeStyle = cur ? 'rgba(25,35,55,.9)' : 'rgba(25,35,55,.16)'; x.lineWidth = cur ? 5 : 3; x.setLineDash(cur ? [14, 10] : [8, 8]);
    x.beginPath(); x.moveTo(60, 360); for (let i = 1; i <= 5; i++) x.lineTo(60 + i * 96, 360 - i * 58 + (R(k * 13 + i) - .5) * 130); x.stroke(); x.setLineDash([]);
    if (!cur) { x.strokeStyle = 'rgba(200,50,40,.5)'; x.lineWidth = 5; const cx = 170 + R(k) * 300, cy = 140 + R(k + 3) * 150; x.beginPath(); x.moveTo(cx - 20, cy - 20); x.lineTo(cx + 20, cy + 20); x.moveTo(cx + 20, cy - 20); x.lineTo(cx - 20, cy + 20); x.stroke(); } }
  x.fillStyle = '#b8352a'; x.font = 'bold 44px MO'; x.fillText('★', 530, 80);
  x.fillStyle = 'rgba(25,35,50,.92)'; x.font = 'bold 40px MO'; x.fillText('PLAN v' + v, 28, 56);
}

// ---------------- IK + poza ----------------
function ik(A, Tg, l1, l2, side) {
  let dx = Tg[0] - A[0], dy = Tg[1] - A[1], d = Math.hypot(dx, dy); const dm = Math.min(d, l1 + l2 - 1e-4), a = Math.atan2(dy, dx);
  const c = Math.acos(clamp((l1 * l1 + dm * dm - l2 * l2) / (2 * l1 * dm), -1, 1)), an = a + side * c;
  const J = [A[0] + Math.cos(an) * l1, A[1] + Math.sin(an) * l1], b = Math.atan2(Tg[1] - J[1], Tg[0] - J[0]);
  return [J, [J[0] + Math.cos(b) * l2, J[1] + Math.sin(b) * l2]];
}
const LT = .485, LS = .47, ANK = .085, LU = .3, LF = .27, TOR = .52;
function bl(a, b, u) { if (typeof a === "number") return lerp(a, b, u); if (Array.isArray(a)) return a.map((v, i) => lerp(v, b[i], u)); const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' || Array.isArray(a[k]) ? bl(a[k], b[k], u) : a[k]; return o; }
function walkPose(x, amp, lantern) {
  const g = G(x), ph = x / T.stride * Math.PI * 2, step = T.stride / 2, feet = [];
  for (let i = 0; i < 2; i++) {
    const u = ((ph / (2 * Math.PI) + i * .5) % 1 + 1) % 1; let rel, lift = 0, ang;
    if (u < .62) { rel = step / 2 - u / .62 * step; ang = slopeA(x + rel) + .45 * seg(u, .48, .62); }
    else { const v = (u - .62) / .38; rel = -step / 2 + eio(v) * step; lift = .14 * Math.sin(Math.PI * v); ang = slopeA(x + rel) + .45 * (1 - seg(v, 0, .4)) - .2 * Math.sin(Math.PI * v); }
    rel *= amp; lift *= amp; const fxw = x + rel;
    feet.push([fxw, G(fxw) + ANK + lift + (ang - slopeA(fxw)) * .06, amp > .05 ? ang : slopeA(fxw)]);
  }
  if (amp < 1) { feet[0] = bl(feet[0], [x + .1, g + ANK, slopeA(x + .1)], 1 - amp); feet[1] = bl(feet[1], [x - .12, g + ANK, slopeA(x - .12)], 1 - amp); }

  for (const f of feet) hy = Math.min(hy, f[1] + Math.sqrt(Math.max(0, .935 * .935 - (f[0] - x) ** 2)));

    hN: lantern ? [.2 + .02 * Math.sin(ph), -.47] : [.55 * Math.sin(-a), -.55 * Math.cos(a)], hF: [.55 * Math.sin(a), -.55 * Math.cos(a)] };
}
function solve(p) {
  const sh = [p.hip[0] + Math.sin(p.lean) * TOR, p.hip[1] + Math.cos(p.lean) * TOR];
  const leg = f => { const [kn, an] = ik(p.hip, [f[0], f[1]], LT, LS, 1); return { kn, an, fa: f[2] }; };
  const arm = h => { const [el, wr] = ik(sh, [sh[0] + h[0], sh[1] + h[1]], LU, LF, -1); return { el, wr }; };
  const nb = [sh[0] + Math.sin(p.lean) * .05, sh[1] + Math.cos(p.lean) * .05], ha = p.lean * .55 + p.head;
  return { hip: p.hip, sh, lean: p.lean, nb, head: [nb[0] + Math.sin(ha) * .15 + .015, nb[1] + Math.cos(ha) * .15], ha, N: leg(p.fN), Fa: leg(p.fF), aN: arm(p.hN), aF: arm(p.hF) };
}
function poseStarter(t) {
  const x = xsAt(t), sp = (xsAt(t + .05) - xsAt(t - .05)) / .1, amp = clamp(sp / .9), g = G(x);
  let p = walkPose(x, amp, true);
  p.head -= .42 * (1 - seg(t, 2.7, 3.3));
  const lu = seg(t, T.ignite - .6, T.ignite - .15) * (1 - seg(t, T.ignite + .25, T.ignite + .8));
  if (lu > 0) p = bl(p, { ...p, hN: [.34, -.06], head: .3 }, eio(lu));
  const [s0, s1] = T.stumble, su = (t - s0) / (s1 - s0);
  if (su > 0 && su < 1) {
    const trip = { ...p, hip: [x + .12, g + .74], lean: .78, head: .05, fN: [x + .48, G(x + .48) + ANK, slopeA(x + .48)], fF: [x - .3, g + .32, .7], hN: [.42, -.2], hF: [.5, -.12] };
    const kneel = { ...p, hip: [x + .04, g + .53], lean: .36, head: .5, fN: [x + .44, G(x + .44) + ANK, slopeA(x + .44)], fF: [x - .5, G(x - .5) + .05, -1.25], hN: [.24, -.42], hF: [.42, -.47] };
    if (su < .2) p = bl(p, trip, eio(su / .2));
    else if (su < .38) p = bl(trip, kneel, eio((su - .2) / .18));
    else if (su < .68) { p = { ...kneel }; p.head = .5 - .35 * seg(su, .5, .68); }

  }
  const up = seg(t, T.raise, T.raise + 1.0);
  if (up > 0) p = bl(p, { ...p, hN: [.1, .6], head: -.42, lean: -.04 }, eio(up));
  return { x, sp, su, J: solve(p) };

// ---------------- izdiham ----------------
const CROWD = T.crowd.map((x, i) => ({ x, i, o: [{ capH: true, puffy: 1.05, k: 1.02 }, { long: true, puffy: .9, k: .93 }, { hair: true, puffy: 1.12, k: 1.06 }, { bun: true, puffy: .92, k: .95 }, { hair: true, puffy: 1.0, k: .99 }][i % 5] }));
const modeAt = t => t < T.modes[0] ? 'laugh' : t < T.modes[1] ? 'phone' : 'clap';
function poseCrowd(c, t) {
  const x = c.x, i = c.i, md = modeAt(t);
  let p = walkPose(x, 0, false); p.fN = [x + .09 + .03 * (i % 2), ANK, 0]; p.fF = [x - .1, ANK, 0];
  let dir = 1;
  if (md === 'laugh') { const b = Math.sin(t * 13 + i * 1.7); p.hip = [x, p.hip[1] - .015 + .015 * b]; p.lean = -.1 + .05 * b; p.head = -.32 + .08 * b;
    const L = [[[.54, .1], [.16, -.3]], [[.13, .22], [.17, -.28]], [[.25, -.42], [.3, -.45]], [[.52, .16], [.1, -.35]], [[.16, -.3], [.14, -.32]]][i % 5];
    p.hN = L[0]; p.hF = L[1]; if (i === 2) { p.lean = .38 + .06 * b; p.head = .12; } if (i === 4) { p.lean = -.2 + .06 * b; p.head = -.55; } if (i === 1) { p.lean = .05 + .04 * b; p.head = -.1; } }
  else if (md === 'phone') { p.lean = .14; p.head = .55; p.hN = [.24, -.03]; p.hF = [.22, -.05]; if (i % 2 === 0) dir = -1; }
  else { const d = .07 * (.5 + .5 * Math.sin(t * 19 + i * 1.3)); p.lean = -.06; p.head = -.5 - .05 * Math.sin(t * 3 + i); p.hN = [.3 + d, .06]; p.hF = [.3 - d, .08];
    if (i === 3) { p.hN = [.15, .62]; p.hF = [.3 - d, .08]; } }

}
function phoneLight(J) {  // ekran işığı
  const w = S(J.aN.wr), hx = sx(J.hip[0]), px = J.dir === -1 ? 2 * hx - w[0] : w[0], m = v => v * C.s;
  glow(px, w[1] - m(.03), Math.max(12, m(.28)), 'rgba(150,190,255,A)', .35);
  X.fillStyle = '#d9e7ff'; X.save(); X.translate(px, w[1] - m(.04)); X.rotate(J.dir * -.5); X.fillRect(-m(.025), -m(.045), m(.05), m(.09)); X.restore();
  return [px, w[1] - m(.04)];
}
function bubble(txt, x, y, a, col) {
  if (a <= 0) return; X.save(); X.globalAlpha = a; X.font = '30px MO'; X.letterSpacing = '2px'; const w = X.measureText(txt).width + 36, bx = clamp(x - w / 2, 24, W - 24 - w), by = y - 30 + (1 - eio(a)) * 14;
  X.fillStyle = 'rgba(14,16,22,.88)'; X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); X.roundRect(bx, by, w, 60, 18); X.fill(); X.stroke();
  X.beginPath(); X.moveTo(clamp(x, bx + 20, bx + w - 20) - 10, by + 60); X.lineTo(clamp(x, bx + 20, bx + w - 20), by + 76); X.lineTo(clamp(x, bx + 20, bx + w - 20) + 8, by + 60); X.fill();
  X.fillStyle = col; X.textBaseline = 'middle'; X.fillText(txt, bx + 18, by + 31); X.restore();
}

// ---------------- insan silueti (yan görünüş, sağa baxır) ----------------
function cap(c, A, B, ra, rb) {  // konik kapsul (piksel)
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L;
  c.beginPath(); c.arc(A[0], A[1], ra, 0, 7); c.fill(); c.beginPath(); c.arc(B[0], B[1], rb, 0, 7); c.fill();
  c.beginPath(); c.moveTo(A[0] + nx * ra, A[1] + ny * ra); c.lineTo(B[0] + nx * rb, B[1] + ny * rb); c.lineTo(B[0] - nx * rb, B[1] - ny * rb); c.lineTo(A[0] - nx * ra, A[1] - ny * ra); c.closePath(); c.fill();
}
function smooth(c, pts) { c.beginPath(); const n = pts.length; c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);

function person(c, J, o) {
  if (J.dir === -1 || o.k) { const gx = sx(J.hip[0]), gy = sy(J.gy ?? 0); c.save(); c.translate(gx, gy); c.scale(J.dir === -1 ? -(o.k || 1) : (o.k || 1), o.k || 1); c.translate(-gx, -gy); personRaw(c, J, o); c.restore(); }
  else personRaw(c, J, o);
}
function personRaw(c, J, o) {
  const s = C.s, m = v => v * s, w2s = p => S(p);

    const hp = w2s(J.hip), kn = w2s(L.kn), an = w2s(L.an), mid = [lerp(kn[0], an[0], .35) - (an[1] - kn[1]) * .03, lerp(kn[1], an[1], .35)];
    cap(c, hp, kn, m(.088), m(.062)); cap(c, kn, mid, m(.062), m(.066)); cap(c, mid, an, m(.066), m(.042));
    // çəkmə
    const fa = L.fa, ca = Math.cos(fa), sa = Math.sin(fa), q = (u, v) => S([L.an[0] + ca * u - sa * v, L.an[1] + sa * u + ca * v]);
    smooth(c, [q(-.06, .05), q(-.085, -.02), q(-.075, -.085), q(.08, -.088), q(.19, -.082), q(.205, -.045), q(.15, -.02), q(.06, .025), q(.03, .06)]);
  };
  const arm = (A, far) => { const sh = w2s(J.sh), el = w2s(A.el), wr = w2s(A.wr); cap(c, sh, el, m(.064), m(.05)); cap(c, el, wr, m(.05), m(.038));
    const d = [wr[0] - el[0], wr[1] - el[1]], L = Math.hypot(...d) || 1; c.beginPath(); c.ellipse(wr[0] + d[0] / L * m(.055), wr[1] + d[1] / L * m(.055), m(.065), m(.045), Math.atan2(d[1], d[0]), 0, 7); c.fill(); };

    const u = [J.sh[0] - J.hip[0], J.sh[1] - J.hip[1]], L = Math.hypot(...u), ux = u[0] / L, uy = u[1] / L, vx = uy, vy = -ux;
    const q = (a, b) => S([J.hip[0] + ux * a * L + vx * b, J.hip[1] + uy * a * L + vy * b]), k = o.puffy || 1;
    smooth(c, [q(-.05, -.13 * k), q(.16, -.14 * k), q(.42, -.1 * k), q(.74, -.12 * k), q(.98, -.075 * k), q(1.04, .02), q(.9, .11 * k), q(.66, .135 * k), q(.42, .11 * k), q(.16, .115 * k), q(-.05, .1 * k)]);

    return q;
  };

    c.save(); c.translate(...hc); c.rotate(J.ha * 1);

function dust(t, c, col, rad, n) { X.save(); X.globalCompositeOperation = 'lighter';

// ---------------- kadrlar ----------------

window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.shadowBlur = 0; X.filter = 'none';

// ---------------- mətn, HUD, post ----------------
function caption(t) {

}
function tag(txt, x, y, col, a, size = 40) { if (a <= 0) return; X.save(); X.globalAlpha = a; X.font = size + 'px MO'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 18; X.fillText(txt, x, y); X.restore(); }
function post(t, sh, st) {

  X.save(); X.globalAlpha = .045; X.drawImage(NOISE[Math.floor(t * 24) % 4], 0, 0, W, H); X.restore();
  if (sh === 'D') { const u = t - (T.stumble[0] + .25); if (u > 0 && u < 1.4) { const p = S([st.x, G(st.x) + 1.95]); tag('−5', p[0] + 40, Math.max(620, p[1]) - u * 60, RED, Math.min(1, u * 6) * (1 - seg(u, 1, 1.4)), 64); } }

  }

    X.save(); X.globalAlpha = a; X.font = '28px MO'; X.letterSpacing = '6px'; X.textBaseline = 'middle'; X.shadowColor = 'rgba(0,0,0,.8)'; X.shadowBlur = 10;
    X.fillStyle = 'rgba(214,222,232,.9)'; X.textAlign = 'left'; X.fillText(`DAY ${String(dayAt(t)).padStart(3, '0')}`, 80, 250); X.textAlign = 'right';
    if (sh === 'A') { X.fillStyle = RED; X.fillText(`LAUGHS  ${Math.round(lerp(3, 48, seg(t, 0, 3)))}`, 1000, 250); }
    else if (sh === 'C') { X.fillStyle = 'rgba(160,190,230,.95)'; X.fillText('WATCHING  0', 1000, 250); }
    else if (sh === 'F') { X.fillStyle = GOLD; X.fillText(`CLAPS  ${Math.round(lerp(40, 1260, seg(t, 14.5, 17.5)))}`, 1000, 250); }
