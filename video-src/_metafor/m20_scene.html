// M20 «Divar» (11-16): bölünmüş ekran (M14/M19 quruluşu). Yuxarı THE BUILDER hər gün kərpic qoyur, divarın üst xətti = Constara qrafiki,
// Day 30 divar uçur (−5), yenidən başlayır; aşağı THE SCROLLER divanda telefonla (mavi işıq üzə), saatlar sayılır. Sonda divar şaquli böyüyür = qrafik (+N vs 0).

let C = { cx: 0, cy: 0, s: 100 };

function dayAt(t) { const D = T.days; let d = D[0][1]; for (let i = 0; i < D.length - 1; i++) { const [a, d0] = D[i], [b, d1] = D[i + 1]; if (t >= a) { let u = clamp((t - a) / (b - a)); u = u * u * (3 - 2 * u); d = d0 + (d1 - d0) * u; } } return d; }
const DIPS = [30.5, 121];
const sig = x => 1 / (1 + Math.exp(-x * 2.2));

const score = d => Math.round(d - 5 * DIPS.filter(c => d > c).length);
// ---------------- IK + poza ----------------
function ik(A, Tg, l1, l2, side) {

const LT = .485, LS = .47, ANK = .085, LU = .3, LF = .27, TOR = .52;
function bl(a, b, u) { if (typeof a === "number") return lerp(a, b, u); if (Array.isArray(a)) return a.map((v, i) => lerp(v, b[i], u)); const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' || Array.isArray(a[k]) ? bl(a[k], b[k], u) : a[k]; return o; }
function walkPose(x, amp, lantern) {

  for (let i = 0; i < 2; i++) {
    const u = ((ph / (2 * Math.PI) + i * .5) % 1 + 1) % 1; let rel, lift = 0, ang;
    if (u < .62) { rel = step / 2 - u / .62 * step; ang = slopeA(x + rel) + .45 * seg(u, .48, .62); }
    else { const v = (u - .62) / .38; rel = -step / 2 + eio(v) * step; lift = .14 * Math.sin(Math.PI * v); ang = slopeA(x + rel) + .45 * (1 - seg(v, 0, .4)) - .2 * Math.sin(Math.PI * v); }
    rel *= amp; lift *= amp; const fxw = x + rel;

}
function solve(p) {
  const sh = [p.hip[0] + Math.sin(p.lean) * TOR, p.hip[1] + Math.cos(p.lean) * TOR];
  const leg = f => { const [kn, an] = ik(p.hip, [f[0], f[1]], LT, LS, 1); return { kn, an, fa: f[2] }; };
  const arm = h => {  // anatomik limit: bazu gövdəyə nisbətən ~20°-dən çox arxaya getmir, dirsək həmişə irəli bükülür
    const tg = [sh[0] + h[0], sh[1] + h[1]]; let [el, wr] = ik(sh, tg, LU, LF, -1);

}
// ---------------- insan silueti (yan görünüş, sağa baxır) ----------------
function cap(c, A, B, ra, rb) {  // konik kapsul (piksel)
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L;
  c.beginPath(); c.arc(A[0], A[1], ra, 0, 7); c.fill(); c.beginPath(); c.arc(B[0], B[1], rb, 0, 7); c.fill();
  c.beginPath(); c.moveTo(A[0] + nx * ra, A[1] + ny * ra); c.lineTo(B[0] + nx * rb, B[1] + ny * rb); c.lineTo(B[0] - nx * rb, B[1] - ny * rb); c.lineTo(A[0] - nx * ra, A[1] - ny * ra); c.closePath(); c.fill();
}
function smooth(c, pts) { c.beginPath(); const n = pts.length; c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); } c.closePath(); c.fill(); }
function person(c, J, o) {

  else personRaw(c, J, o);
}
function personRaw(c, J, o) {

function litFigure(J, o, lights, base) {

  let bx = Math.max(0, Math.floor(Math.min(...pts.map(p => p[0])) - mg)), by = Math.max(0, Math.floor(Math.min(...pts.map(p => p[1])) - mg));

// ---------------- şəhər fonu (gecə) ----------------
const STARS = Array.from({ length: 140 }, (_, i) => [R(i * 3 + 1), R(i * 3 + 2) * .45, .5 + Math.pow(R(i * 3 + 3), 5) * 2]);
const BLD = Array.from({ length: 60 }, (_, i) => [i * 1.7 + R(i) * .8, 1.2 + R(i + 40) * 2.6, .9 + R(i + 80) * .9]);
function cityBG(t, par, mf = 1) {
  const { ox, oy, w, h } = C;
  let g = X.createLinearGradient(0, oy, 0, oy + h); g.addColorStop(0, '#04060b'); g.addColorStop(.6, '#0e1322'); g.addColorStop(1, '#07080b'); X.fillStyle = g; X.fillRect(ox, oy, w, h);
  for (const [a, b, r] of STARS) { X.fillStyle = `rgba(225,232,255,${.2 + .45 * (r - .5) / 2})`; X.fillRect(ox + ((a * w - C.cx * par * 2) % w + w) % w, oy + b * h, r, r); }
  const mx = ox + w * .8, my = oy + h * .17; let m = X.createRadialGradient(mx, my, 0, mx, my, 180); m.addColorStop(0, 'rgba(170,190,230,.22)'); m.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = m; X.fillRect(ox, oy, w, h);
  X.globalAlpha = mf; X.fillStyle = '#e8ecf5'; X.beginPath(); X.arc(mx, my, 22, 0, 7); X.fill(); X.globalAlpha = 1;

  const base = sy(0) - 4, k = 38 * Math.min(1.6, C.s / 140);
  for (const [bx, bh, bw] of BLD) {
    const x0 = ox + ((bx * 60 - C.cx * par * 18) % (w + 200) + w + 200) % (w + 200) - 100, hh = bh * k, ww = bw * k;
    X.fillStyle = '#0a0d15'; X.fillRect(x0, base - hh, ww, hh);
    for (let r = 0; r < 8; r++) for (let q = 0; q < 3; q++) { const on = R(bx * 7 + r * 3 + q) > .78; if (!on) continue; const wy = base - hh + 8 + r * hh / 8.5; if (wy > base - 6) continue;
      X.fillStyle = `rgba(255,${200 + 30 * R(r + q)},140,${.35 + .3 * R(bx + r)})`; X.fillRect(x0 + 5 + q * (ww - 10) / 3, wy, Math.max(2, ww / 7), Math.max(2, hh / 22)); }
  }

  const gy = sy(0); let gg = X.createLinearGradient(0, gy, 0, oy + h); gg.addColorStop(0, '#16130f'); gg.addColorStop(1, '#070605'); X.fillStyle = gg; X.fillRect(ox, gy, w, oy + h - gy);

}

// ---------------- BUILDER: divarın üst xətti = qrafik ----------------
const T_SINK = T.sink;
const wallX = d => .4 + 58 * Math.pow(d / 365, 1.2);           // divarın ucu (dünya x)
const dOfX = x => 365 * Math.pow(Math.max(0, x - .4) / 58, 1 / 1.2);
const HMAX = hgt(365);
const wallH = (d, ex) => .25 + (1.25 * ex) * Math.max(0, hgt(d) + 6) / (HMAX + 6) + .05;  // ex: reveal-də şaquli böyütmə
const BW = .24, BH = .11;
function drawWall(t, dNow, ex, lamp) {

  X.save(); X.beginPath(); X.moveTo(sx(xa), sy(0));
  for (let x = Math.floor(xa / BW) * BW; x <= xb; x += BW) { const x1 = Math.max(xa, x), x2 = Math.min(xb, x + BW), hh = Math.floor(wallH(dOfX(Math.min(xb, x + BW / 2)), ex) / BH) * BH + BH;
    X.lineTo(sx(x1), sy(hh)); X.lineTo(sx(x2), sy(hh)); }
  X.lineTo(sx(xb), sy(0)); X.closePath(); X.clip();
  let g = X.createLinearGradient(0, sy(2), 0, sy(0)); g.addColorStop(0, '#6b3a26'); g.addColorStop(1, '#3a1f15'); X.fillStyle = g; X.fillRect(C.ox, C.oy, C.w, C.h);
  // isti lampa işığı
  X.globalCompositeOperation = 'lighter'; let lg = X.createRadialGradient(lamp[0], lamp[1], 0, lamp[0], lamp[1], 2.4 * C.s); lg.addColorStop(0, 'rgba(255,170,80,.55)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = lg; X.fillRect(C.ox, C.oy, C.w, C.h);

      for (let x = Math.floor(xa / BW) * BW + (r % 2) * BW / 2; x <= xb; x += BW) { X.beginPath(); X.moveTo(sx(x), y); X.lineTo(sx(x), sy((r + 1) * BH)); X.stroke(); } } }

  X.save(); X.globalCompositeOperation = 'lighter'; X.lineCap = 'round'; X.lineJoin = 'round'; X.lineWidth = Math.max(2.5, .022 * C.s + ex * .4); X.shadowBlur = 14;

}
function fallBricks(t, x, top) {  // Day 30 çöküş

  for (let i = 0; i < 11; i++) { const vx = (R(i) - .65) * 2.2, vy = 1 + R(i + 5) * 1.5, px = x - .3 - R(i + 2) * .6 + vx * u, py = Math.max(BH / 2, top - .1 + R(i + 8) * .3 + vy * u - 4.9 * u * u);

    X.strokeStyle = 'rgba(255,170,90,.6)'; X.lineWidth = 1.5; X.strokeRect(-BW / 2 * C.s, -BH / 2 * C.s, BW * C.s, BH * C.s - 1); X.restore(); }

function builderPose(t, xs, speed, top) {
  const k = clamp(speed / 1.6), wp = walkPose(xs, k, false), u = (t * .85) % 1;

function builderPanel(t) {

  if (r > 0) { X.save(); X.globalAlpha = r; X.font = '24px MO'; X.fillStyle = 'rgba(220,220,220,.6)'; X.textAlign = 'left'; X.fillText('DAY 1', PX + 60, P1 + PH - 34); X.textAlign = 'right'; X.fillText('DAY 365', PX + PW - 60, P1 + PH - 34);
    X.font = '52px MO'; X.fillStyle = GOLD; X.shadowColor = GOLD; X.shadowBlur = 22; X.fillText('+' + score(365), PX + PW - 70, P1 + 150); X.restore(); }
}

// ---------------- SCROLLER: divanda, telefon işığı üzə ----------------
function roomBG(t) {

  // pəncərə: gecə şəhəri

  for (let i = 0; i < 9; i++) { const bh = (.3 + R(i + 3) * .6) * wh, bw = ww / 9; X.fillStyle = '#080b13'; X.fillRect(wx + i * bw, wy + wh - bh, bw - 2, bh);
    for (let r = 0; r < 5; r++) if (R(i * 9 + r) > .7) { X.fillStyle = 'rgba(255,215,150,.45)'; X.fillRect(wx + i * bw + 6, wy + wh - bh + 8 + r * bh / 5.5, 5, 4); } }
  X.strokeStyle = '#1b1e26'; X.lineWidth = 8; X.strokeRect(wx, wy, ww, wh); X.beginPath(); X.moveTo(wx + ww / 2, wy); X.lineTo(wx + ww / 2, wy + wh); X.stroke();

function scrollerPanel(t) {

  X.beginPath(); X.roundRect(sx(SX - .85), sy(1.15), .28 * C.s, 1.0 * C.s, 16); X.fill(); X.fillRect(sx(SX - .75), sy(.18), .08 * C.s, .18 * C.s); X.fillRect(sx(SX + .7), sy(.18), .08 * C.s, .18 * C.s);

    { p: S([.9, 2.6]), a: .35, r: 10, fill: 'rgba(0,0,0,A)', rim: 'rgb(170,180,210)', k: .8 }], '#4a5262');

const TOP_PANEL = builderPanel, BOT_PANEL = scrollerPanel;

// ---------------- çərçivə, mətn ----------------
function panelClip(y, col, fn) {

}

}
function pill(x, y, txt, col, bg, align) {

const NOISE = [0, 1, 2].map(k => { const c = mk(540, 960), x = c.getContext('2d'), d = x.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R(i * .37 + k * 91.3) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
window.draw = function (t) {
