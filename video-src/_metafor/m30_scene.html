// ---------------- M30: CLIMBER (işıqlı pilləkən qəfəsi) vs WAITER (lift qarşısında gözləyir) — İŞIQLI ----------------
const T_SINK = T.sink, GREEN = '#26D67F', INK = '#1F2A3D';
const PAL_A = { skin: '#E3A97F', shirt: '#22B86C', pants: '#2F3B55', shoes: '#F4F4F4', hair: '#2B1E16', far: .78 };

function climbPose(x, tired) {
