<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
@font-face{font-family:MO;src:url(file:///usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*TL*/
// M07 «Batareya»: 11 s loop. Kartlar batareyanı boşaldır/doldurur; son kadr = ilk kadr.
const T = window.TL;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = 1080, H = 1920, G = 1560, BX = 540, BY = 760, BW = 440, BH = 190;
const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA', INK = '#0B0B0C';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const eout = u => 1 - Math.pow(1 - u, 3);
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const bump = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
const R = k => { let x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function ik(ax, ay, bx, by, l1, l2, flip) { let dx = bx - ax, dy = by - ay, d = Math.min(Math.hypot(dx, dy), l1 + l2 - .01);
  let a = Math.atan2(dy, dx), c = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)), ang = a + (flip ? -c : c); return [ax + Math.cos(ang) * l1, ay + Math.sin(ang) * l1]; }
function reach(a, b, L) { let d = Math.hypot(b[0] - a[0], b[1] - a[1]); return d <= L ? b : [a[0] + (b[0] - a[0]) / d * L, a[1] + (b[1] - a[1]) / d * L]; }
function limb(p, w, col) { X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = INK; X.lineWidth = w + 7; X.beginPath(); X.moveTo(...p[0]); for (let i = 1; i < p.length; i++) X.lineTo(...p[i]); X.stroke(); X.strokeStyle = col; X.lineWidth = w; X.stroke(); }
function figure(o) {
  const s = o.sc, col = WHITE, sl = o.slump, hip = [o.x, o.base - 176 * s + sl * 26 * s];
  const fL = [o.x - 34 * s, o.base], fR = [o.x + 34 * s, o.base];
  const kL = ik(hip[0] - 14 * s, hip[1], fL[0], fL[1], 90 * s, 90 * s, true), kR = ik(hip[0] + 14 * s, hip[1], fR[0], fR[1], 90 * s, 90 * s, false);
  const neck = [hip[0], hip[1] - 160 * s * (1 - .12 * sl)], shL = [neck[0] - 31 * s, neck[1] + 22 * s + sl * 14 * s], shR = [neck[0] + 31 * s, neck[1] + 22 * s + sl * 14 * s];
  const head = [neck[0], neck[1] - 46 * s + sl * 30 * s];
  const hL = reach(shL, o.hl || [shL[0] - 14 * s - (1 - sl) * 6 * s, hip[1] + 40 * s + sl * 20 * s], 170 * s), hR = reach(shR, o.hr || [shR[0] + 14 * s + (1 - sl) * 6 * s, hip[1] + 40 * s + sl * 20 * s], 170 * s);
  const eL = ik(shL[0], shL[1], hL[0], hL[1], 85 * s, 85 * s, !!o.hl), eR = ik(shR[0], shR[1], hR[0], hR[1], 85 * s, 85 * s, !o.hr);
  limb([[hip[0] - 14 * s, hip[1]], kL, fL], 30 * s, col); limb([[hip[0] + 14 * s, hip[1]], kR, fR], 30 * s, col);
  limb([hip, neck], 52 * s, col); limb([shL, eL, hL], 25 * s, col); limb([shR, eR, hR], 25 * s, col);
  X.fillStyle = INK; X.beginPath(); X.arc(head[0], head[1], 40 * s, 0, 7); X.fill(); X.fillStyle = col; X.beginPath(); X.arc(head[0], head[1], 36 * s, 0, 7); X.fill();
  const ey = head[1] - 3 * s + sl * 10 * s; X.fillStyle = '#1A1A1A';
  if (sl > .55) { X.strokeStyle = '#1A1A1A'; X.lineWidth = 3.5 * s; [-11, 11].forEach(dx => { X.beginPath(); X.moveTo(head[0] + dx * s - 6 * s, ey); X.lineTo(head[0] + dx * s + 6 * s, ey); X.stroke(); }); }
  else { X.beginPath(); X.arc(head[0] - 11 * s, ey, 4.4 * s, 0, 7); X.arc(head[0] + 11 * s, ey, 4.4 * s, 0, 7); X.fill(); }
  if (o.smile > 0) { X.strokeStyle = '#1A1A1A'; X.lineWidth = 3 * s; X.beginPath(); X.arc(head[0], ey + 9 * s, 9 * s * o.smile, .15 * Math.PI, .85 * Math.PI); X.stroke(); }
}
// səviyyə: kartların zərbəsi ilə (0.15 s keçid); 100 → 25 → 100
function level(t) { let v = 100; T.cards.forEach(([tc, , d]) => { v += d * eout(seg(t, tc, tc + .18)); }); return v; }
function lvlCol(v) { return v > 60 ? '#2EE59D' : v > 35 ? '#F7C04A' : '#FF4D4D'; }
function battery(t, v) {
  let sh = 0; T.cards.forEach(([tc]) => { sh = Math.max(sh, bump(t, tc + .03, .08)); });
  X.save(); X.translate(BX + Math.sin(t * 90) * sh * 10, BY + Math.cos(t * 70) * sh * 5);
  const col = lvlCol(v);
  // halo
  X.globalCompositeOperation = 'lighter'; let g = X.createRadialGradient(0, 0, 40, 0, 0, 420); g.addColorStop(0, col + '55'); g.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = g; X.fillRect(-460, -460, 920, 920); X.globalCompositeOperation = 'source-over';
  X.fillStyle = '#0D0F14'; X.strokeStyle = '#E9E6DE'; X.lineWidth = 10; X.beginPath(); X.roundRect(-BW / 2, -BH / 2, BW, BH, 34); X.fill(); X.stroke();
  X.fillStyle = '#E9E6DE'; X.beginPath(); X.roundRect(BW / 2 + 6, -38, 30, 76, 10); X.fill();
  const fw = (BW - 36) * clamp(v / 100); let fg = X.createLinearGradient(-BW / 2, 0, BW / 2, 0); fg.addColorStop(0, col); fg.addColorStop(1, col + 'CC');
  X.fillStyle = fg; X.shadowColor = col; X.shadowBlur = 30; X.beginPath(); X.roundRect(-BW / 2 + 18, -BH / 2 + 18, Math.max(16, fw), BH - 36, 20); X.fill(); X.shadowBlur = 0;
  // parıltı zolağı
  X.fillStyle = 'rgba(255,255,255,.18)'; X.beginPath(); X.roundRect(-BW / 2 + 26, -BH / 2 + 26, Math.max(8, fw - 16), 22, 10); X.fill();
  X.fillStyle = WHITE; X.font = '96px IB'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.shadowColor = 'rgba(0,0,0,.7)'; X.shadowBlur = 16;
  X.fillText(Math.round(v) + '%', 0, 6); X.restore();
}
function card(t, c, i) {
  const [tc, txt, d, col, side] = c, t0 = tc - .75, u = seg(t, t0, tc), out = seg(t, tc, tc + .25);
  if (u <= 0 || out >= 1) return;
  const sx = side < 0 ? -260 : W + 260, sy = 1200 + (i % 2) * 120, e = ease(u);
  const x = lerp(sx, BX + side * 40, e), y = lerp(sy, BY, e) - Math.sin(e * Math.PI) * 220, sc = lerp(1.15, .8, e) * (1 - out), rot = (1 - e) * side * .35;
  X.save(); X.translate(x, y); X.rotate(rot); X.scale(sc, sc); X.globalAlpha = 1 - out;
  X.font = '50px MO'; const label = `${txt} ${d > 0 ? '+' : '−'}${Math.abs(d)}%`, w = X.measureText(label).width + 60;
  X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 30; X.beginPath(); X.roundRect(-w / 2, -48, w, 96, 26); X.fill(); X.shadowBlur = 0;
  X.fillStyle = '#0B0B0C'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(label, 0, 3); X.restore();
}
function popups(t) {
  T.cards.forEach(([tc, , d, col], i) => { const u = seg(t, tc, tc + .9); if (u <= 0 || u >= 1) return;
    X.save(); X.globalAlpha = 1 - u; X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 20; X.font = '70px IB'; X.textAlign = 'center';
    X.fillText(`${d > 0 ? '+' : '−'}${Math.abs(d)}`, BX + (i % 2 ? 250 : -250), BY - 120 - u * 120); X.restore();
    // qığılcımlar
    for (let k = 0; k < 14; k++) { const a = R(i * 20 + k) * 6.28, r = 60 + 260 * eout(u) * (.5 + R(k + i)), px = BX + Math.cos(a) * r, py = BY + Math.sin(a) * r * .7;
      X.fillStyle = col; X.globalAlpha = (1 - u) * .9; X.beginPath(); X.arc(px, py, 5 * (1 - u) + 1, 0, 7); X.fill(); } X.globalAlpha = 1; });
}
function caption(t) {
  for (const [a, b, txt, hi, hc] of T.texts) {
    if (t < a || t >= b) continue;
    const first = a === 0 || b === T.dur, al = first ? 1 : Math.min(seg(t, a, a + .15), 1 - seg(t, b - .12, b));
    X.save(); X.globalAlpha = al; X.font = '58px MO'; X.letterSpacing = '3px'; X.textBaseline = 'middle';
    const lines = txt.split('\n'), y0 = 330 - (lines.length - 1) * 38 + (first ? 0 : (1 - eout(seg(t, a, a + .25))) * 12);
    lines.forEach((ln, li) => { let x = W / 2 - X.measureText(ln).width / 2, y = y0 + li * 78, i = ln.indexOf(hi);
      const parts = i < 0 ? [[ln, WHITE]] : [[ln.slice(0, i), WHITE], [hi, hc === 'red' ? RED : GOLD], [ln.slice(i + hi.length), WHITE]];
      for (const [p, c] of parts) { if (!p) continue; X.fillStyle = c; X.shadowColor = c === WHITE ? 'rgba(0,0,0,.6)' : c; X.shadowBlur = c === WHITE ? 8 : 20; X.fillText(p, x, y); x += X.measureText(p).width; } });
    X.restore();
  }
}
window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  const v = level(t), low = clamp((100 - v) / 75), col = lvlCol(v);
  // fon: rəngli işıqlar (səviyyəyə görə)
  let g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07080D'); g.addColorStop(1, '#020203'); X.fillStyle = g; X.fillRect(0, 0, W, H);
  X.globalCompositeOperation = 'lighter';
  [[180, 520, '#7B2CFF'], [900, 640, '#FF2D7A'], [540, 1400, col]].forEach(([x, y, c], i) => { const r = X.createRadialGradient(x, y, 20, x, y, 700); r.addColorStop(0, c + (i === 2 ? '40' : '22')); r.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = r; X.fillRect(0, 0, W, H); });
  X.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 50; i++) { X.fillStyle = `rgba(255,255,255,${.04 + .08 * R(i)})`; X.beginPath(); X.arc(R(i + 1) * W, (R(i + 2) * H + t * 40 * (1 + R(i))) % H, 1.5 + 2 * R(i + 3), 0, 7); X.fill(); }
  // döşəmə + kabel (batareyadan fiqura)
  X.fillStyle = '#0B0C10'; X.fillRect(0, G, W, H - G);
  X.strokeStyle = col + '88'; X.lineWidth = 6; X.setLineDash([14, 14]); X.lineDashOffset = -t * 120 * (v > level(t - .05) ? 1 : -1);
  X.beginPath(); X.moveTo(BX, BY + BH / 2 + 10); X.bezierCurveTo(BX, BY + 240, BX, 1040, BX, 1090); X.stroke(); X.setLineDash([]);
  // əks
  X.save(); X.translate(0, 2 * G); X.scale(1, -1); X.globalAlpha = .16; figure({ x: BX, base: G, sc: 1.25, slump: low }); X.restore();
  let rf = X.createLinearGradient(0, G, 0, G + 300); rf.addColorStop(0, 'rgba(2,2,3,0)'); rf.addColorStop(1, 'rgba(2,2,3,1)'); X.fillStyle = rf; X.fillRect(0, G, W, 300);
  const joy = seg(t, 8.05, 8.3) * (1 - seg(t, 10.2, 10.9));
  figure({ x: BX, base: G, sc: 1.25, slump: low, smile: joy, hl: joy > .05 ? [BX - 120, G - 560] : null, hr: joy > .05 ? [BX + 120, G - 560] : null });
  battery(t, v);
  T.cards.forEach((c, i) => card(t, c, i));
  popups(t);
  let vg = X.createRadialGradient(540, 960, 520, 540, 960, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); X.fillStyle = vg; X.fillRect(0, 0, W, H);
  caption(t);
  X.save(); X.globalAlpha = .7; X.fillStyle = 'rgba(210,204,190,.9)'; X.font = '26px MO'; X.letterSpacing = '6px'; X.textAlign = 'center'; X.fillText('@constara.app', W / 2 + 3, 1820); X.restore();
};
document.fonts.ready.then(() => { window.READY = true; });
['MO', 'IB'].forEach(f => document.fonts.load('40px ' + f));
</script></body></html>
