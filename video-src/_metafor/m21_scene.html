<script>

// M21 «Zəngli saat» (11-16): bölünmüş ekran (M14/M19 quruluşu). Yuxarı THE RISER hər səhər qaçır, yol = Constara qrafiki, səma günlərlə gecədən şəfəqə keçir;
// Day 30 yıxılır (−5), qalxır. Aşağı THE SNOOZER yataqda, zəngli saat çalır, əl çıxıb snooze basır, pərdə arxasında gün artır. Sonda geri çəkilmə (+N vs 0).

const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA', GREY = '#A7ADB5';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

function dayAt(t) { const D = T.days; let d = D[0][1]; for (let i = 0; i < D.length - 1; i++) { const [a, d0] = D[i], [b, d1] = D[i + 1]; if (t >= a) { let u = clamp((t - a) / (b - a)); u = u * u * (3 - 2 * u); d = d0 + (d1 - d0) * u; } } return d; }

const sig = x => 1 / (1 + Math.exp(-x * 2.2));

const score = d => Math.round(d - 5 * DIPS.filter(c => d > c).length);
// ---------------- IK + poza ----------------
function ik(A, Tg, l1, l2, side) {

const LT = .485, LS = .47, ANK = .085, LU = .3, LF = .27, TOR = .52;
function bl(a, b, u) { if (typeof a === "number") return lerp(a, b, u); if (Array.isArray(a)) return a.map((v, i) => lerp(v, b[i], u)); const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' || Array.isArray(a[k]) ? bl(a[k], b[k], u) : a[k]; return o; }
function walkPose(x, amp, lantern) {

  for (let i = 0; i < 2; i++) {
    const u = ((ph / (2 * Math.PI) + i * .5) % 1 + 1) % 1; let rel, lift = 0, ang;
    if (u < .62) { rel = step / 2 - u / .62 * step; ang = slopeA(x + rel) + .45 * seg(u, .48, .62); }
    else { const v = (u - .62) / .38; rel = -step / 2 + eio(v) * step; lift = .14 * Math.sin(Math.PI * v); ang = slopeA(x + rel) + .45 * (1 - seg(v, 0, .4)) - .2 * Math.sin(Math.PI * v); }

function solve(p) {
  const sh = [p.hip[0] + Math.sin(p.lean) * TOR, p.hip[1] + Math.cos(p.lean) * TOR];
  const leg = f => { const [kn, an] = ik(p.hip, [f[0], f[1]], LT, LS, 1); return { kn, an, fa: f[2] }; };
  const arm = h => {  // anatomik limit: bazu gövdəyə nisbətən ~20°-dən çox arxaya getmir, dirsək həmişə irəli bükülür

// ---------------- insan silueti (yan görünüş, sağa baxır) ----------------
function cap(c, A, B, ra, rb) {  // konik kapsul (piksel)

    return q;

// ---------------- M21: yol = qrafik, səma günlərlə gecədən şəfəqə keçir ----------------
const T_SINK = T.sink;
const runX = d => .6 + 58 * Math.pow(d / 365, 1.15);

const roadH = d => .028 * (.95 * d + 10 * Math.sin(d / 7) - 34 / (1 + Math.exp(-(d - 30.5) / 2.2)) - 28 / (1 + Math.exp(-(d - 121) / 4)));
const ROAD = x => x < .6 ? 0 : roadH(dOfX(x));
G = x => ROAD(x); slopeA = x => Math.atan2(ROAD(x + .05) - ROAD(x - .05), .1);
const STARS = Array.from({ length: 150 }, (_, i) => [R(i * 3 + 1), R(i * 3 + 2) * .55, .5 + Math.pow(R(i * 3 + 3), 5) * 2]);
const mixc = (a, b, u) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], u))).join(',')})`;
function skyAt(dawn) {  // 0 gecə → 1 şəfəq
  const top = mixc([4, 6, 11], [22, 34, 70], dawn), mid = mixc([13, 19, 34], [120, 90, 120], dawn), hor = mixc([7, 8, 11], [255, 150, 80], dawn);
  return [top, mid, hor];
}
function dawnBG(t, dawn, par, sunY) {
  const { ox, oy, w, h } = C, [a, b, c] = skyAt(dawn);
  let g = X.createLinearGradient(0, oy, 0, oy + h); g.addColorStop(0, a); g.addColorStop(.62, b); g.addColorStop(.9, c); X.fillStyle = g; X.fillRect(ox, oy, w, h);
  for (const [sx_, sy_, r] of STARS) { X.fillStyle = `rgba(225,232,255,${(.25 + .45 * (r - .5) / 2) * (1 - dawn)})`; X.fillRect(ox + ((sx_ * w - C.cx * par * 2) % w + w) % w, oy + sy_ * h, r, r); }
  // günəş (şəfəq)
  const sx0 = ox + w * .78, sy0 = oy + h * lerp(.95, .38, sunY);
  let m = X.createRadialGradient(sx0, sy0, 0, sx0, sy0, 380); m.addColorStop(0, `rgba(255,190,110,${.55 * dawn})`); m.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = m; X.fillRect(ox, oy, w, h);
  X.fillStyle = `rgba(255,236,190,${dawn})`; X.beginPath(); X.arc(sx0, sy0, 30, 0, 7); X.fill();

    X.lineTo(ox + w, oy + h); X.fill();
  }

}
function drawRoad(r, dawn) {
  const xa = C.cx - C.w / 2 / C.s - 1, xb = C.cx + C.w / 2 / C.s + 1, st = Math.max(.02, 1.5 / C.s);
  X.fillStyle = mixc([9, 9, 12], [30, 22, 26], dawn); X.beginPath(); X.moveTo(sx(xa), C.oy + C.h);
  for (let x = xa; x <= xb; x += st) X.lineTo(sx(x), sy(ROAD(x))); X.lineTo(sx(xb), C.oy + C.h); X.fill();

function trail(xEnd, r) {  // qaçılan yol parlayır = qrafik

  let prev = null; const st = Math.max(.02, 1.5 / C.s);

    if (prev) { X.strokeStyle = dip ? 'rgba(255,90,74,.95)' : 'rgba(247,192,74,.8)'; X.shadowColor = X.strokeStyle; X.beginPath(); X.moveTo(...prev); X.lineTo(...q); X.stroke(); } prev = q; }
  X.restore();
}
function runPose(t, x, fall) {

    const g = ROAD(x), kneel = { hip: [x - .1, g + .55], lean: .65, head: .3, fN: [x + .35, g + ANK, slopeA(x)], fF: [x - .55, g + .06, slopeA(x) + 1.2], hN: [.35, -.45], hF: [.3, -.5] };

function riserPanel(t) {

}

// ---------------- SNOOZER: yataq, zəngli saat ----------------
const SNZ = 1.6;  // hər SNZ saniyədə bir snooze

  X.beginPath(); X.moveTo(wx + ww * .5 - 4, wy); X.lineTo(wx + ww * .5 + 4, wy); X.lineTo(wx + ww * .5 - 380, oy + h); X.lineTo(wx + ww * .5 - 560, oy + h); X.fill(); X.restore();

  X.fillRect(sx(BX - 1.1), sy(1.05), .12 * C.s, .9 * C.s); X.fillRect(sx(BX + 1.05), sy(.75), .1 * C.s, .6 * C.s);

  X.fillStyle = '#3a3346'; X.beginPath(); const bp = [[BX - .55, .6], [BX - .5, .86], [BX - .1, .92], [BX + .35, .86], [BX + .7, .8], [BX + 1.0, .72], [BX + 1.02, .55]];
  X.moveTo(sx(bp[0][0]), sy(bp[0][1])); for (let i = 1; i < bp.length; i++) X.lineTo(sx(bp[i][0]), sy(bp[i][1]) + 3 * Math.sin(t * 1.2 + i)); X.closePath(); X.fill();

  X.save(); X.font = '30px MO'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillStyle = '#FF3B30'; X.shadowColor = '#FF3B30'; X.shadowBlur = ring ? 22 : 10; X.fillText(r > 0 ? '11:47' : '06:00', cxp, cyp - 8); X.restore();
  X.save(); X.globalCompositeOperation = 'lighter'; let cg = X.createRadialGradient(cxp, cyp, 4, cxp, cyp, 260); cg.addColorStop(0, `rgba(255,50,40,${ring ? .3 : .12})`); cg.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = cg; X.fillRect(cxp - 270, cyp - 270, 540, 540); X.restore();
  if (ring) { X.save(); X.strokeStyle = 'rgba(255,90,80,.7)'; X.lineWidth = 3; for (let k = 1; k <= 2; k++) { X.globalAlpha = 1 - ph / .35; X.beginPath(); X.arc(cxp, cyp - 8, 55 + k * 18 + ph * 40, -2.4, -.7); X.stroke(); } X.restore();

const TOP_PANEL = riserPanel, BOT_PANEL = snoozerPanel;

// ---------------- çərçivə, mətn ----------------
function panelClip(y, col, fn) {
  X.save(); X.beginPath(); X.roundRect(PX, y, PW, PH, 28); X.clip(); fn(); X.restore();
  X.save(); X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); X.roundRect(PX, y, PW, PH, 28); X.stroke(); X.restore();
}
function caption(t) {
  for (const [a, b, txt, hi, hc] of T.texts) {
    if (t < a || t > b) continue;
    const al = Math.min(seg(t, a, a + .25), 1 - seg(t, b - .2, b)), lines = txt.split('\n');
    X.save(); X.globalAlpha = al; X.font = (lines.length > 2 || txt.length > 40 ? '38px' : '46px') + ' MO'; X.letterSpacing = '3px'; X.textBaseline = 'middle';
    const lh = lines.length > 2 ? 56 : 64, y0 = 215 - (lines.length - 1) * lh / 2 + (1 - eout(seg(t, a, a + .35))) * 12;
    lines.forEach((ln, li) => { let x = W / 2 - X.measureText(ln).width / 2; const y = y0 + li * lh, i = ln.indexOf(hi);
      const parts = i < 0 ? [[ln, WHITE]] : [[ln.slice(0, i), WHITE], [hi, hc === 'red' ? RED : GOLD], [ln.slice(i + hi.length), WHITE]];
      for (const [p, c] of parts) { if (!p) continue; X.fillStyle = c; X.shadowColor = c === WHITE ? 'rgba(0,0,0,.6)' : c; X.shadowBlur = c === WHITE ? 8 : 18; X.fillText(p, x, y); x += X.measureText(p).width; } });
    X.restore();
  }
}

  X.save(); X.font = '28px MO'; X.letterSpacing = '3px'; const w = X.measureText(txt).width + 40, x0 = align === 'c' ? x - w / 2 : align === 'r' ? x - w : x;
  X.fillStyle = bg; X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); X.roundRect(x0, y - 26, w, 52, 26); X.fill(); X.stroke();
  X.fillStyle = col; X.textBaseline = 'middle'; X.fillText(txt, x0 + 20, y + 1); X.restore();
}
const NOISE = [0, 1, 2].map(k => { const c = mk(540, 960), x = c.getContext('2d'), d = x.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R(i * .37 + k * 91.3) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.shadowBlur = 0; X.letterSpacing = '0px';
  X.fillStyle = '#050506'; X.fillRect(0, 0, W, H);
  const d = dayAt(t);
  panelClip(P1, 'rgba(247,192,74,.35)', () => TOP_PANEL(t));
  panelClip(P2, 'rgba(167,173,181,.25)', () => BOT_PANEL(t));
  X.save(); X.font = '30px MO'; X.letterSpacing = '6px'; X.textBaseline = 'middle';
  X.fillStyle = GOLD; X.shadowColor = GOLD; X.shadowBlur = 14; X.fillText(T.labels[0], PX + 34, P1 + 46);
  X.fillStyle = GREY; X.shadowBlur = 0; X.fillText(T.labels[1], PX + 34, P2 + 46); X.restore();
  const sinkNow = bump(t, T_SINK + .55, .45) > .3;
  pill(PX + PW - 26, P1 + 46, `SCORE +${Math.max(0, score(d))}`, sinkNow ? RED : GOLD, 'rgba(20,16,8,.85)', 'r');
  pill(PX + PW - 26, P2 + 46, 'SCORE 0', GREY, 'rgba(14,15,17,.85)', 'r');

  X.save(); X.globalAlpha = .04; X.drawImage(NOISE[Math.floor(t * 24) % 3], 0, 0, W, H); X.restore();
  caption(t);
  const ea = seg(t, T.end + .5, T.end + 1); if (ea > 0) { X.save(); X.globalAlpha = ea; X.fillStyle = 'rgba(225,220,205,.92)'; X.font = '34px MO'; X.letterSpacing = '6px'; X.textAlign = 'center'; X.fillText('@constara.app', W / 2 + 3, 1820); X.restore(); }
};
