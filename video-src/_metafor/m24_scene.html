/*TL*/
// M24 «Ştanq» (11-17): bölünmüş ekran. Yuxarı THE LIFTER qarajda hər gün squat (20 → 120 KG), Day 30 ştanq yıxılır (−5);
// aşağı THE WAITER divanda, təqvimdə «MONDAY: START GYM» hər həftə xətlənir. Sonda qrafik (+N vs 0).
const T = window.TL, W = 1080, H = 1920, P1 = 330, P2 = 1050, PH = 660, PX = 30, PW = 1020;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA', GREY = '#A7ADB5';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;

const G = x => 0, slopeA = x => 0;
let C = { cx: 0, cy: 0, s: 100 };
const sx = x => C.ox + C.w / 2 + (x - C.cx) * C.s, sy = y => C.oy + C.h / 2 - (y - C.cy) * C.s, S = p => [sx(p[0]), sy(p[1])];
function dayAt(t) { const D = T.days; let d = D[0][1]; for (let i = 0; i < D.length - 1; i++) { const [a, d0] = D[i], [b, d1] = D[i + 1]; if (t >= a) { let u = clamp((t - a) / (b - a)); u = u * u * (3 - 2 * u); d = d0 + (d1 - d0) * u; } } return d; }
const DIPS = [30.5, 121];
const sig = x => 1 / (1 + Math.exp(-x * 2.2));
const hgt = d => .95 * d + 10 * Math.sin(d / 7) - 34 * sig(d - DIPS[0]) - 28 * sig(d - DIPS[1]);
const score = d => Math.round(d - 5 * DIPS.filter(c => d > c).length);
// ---------------- IK + poza ----------------
function ik(A, Tg, l1, l2, side) {

}
const LT = .485, LS = .47, ANK = .085, LU = .3, LF = .27, TOR = .52;
function bl(a, b, u) { if (typeof a === "number") return lerp(a, b, u); if (Array.isArray(a)) return a.map((v, i) => lerp(v, b[i], u)); const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' || Array.isArray(a[k]) ? bl(a[k], b[k], u) : a[k]; return o; }
function walkPose(x, amp, lantern) {
  const g = G(x), ph = x / T.stride * Math.PI * 2, step = T.stride / 2, feet = [];
  for (let i = 0; i < 2; i++) {
    const u = ((ph / (2 * Math.PI) + i * .5) % 1 + 1) % 1; let rel, lift = 0, ang;
    if (u < .62) { rel = step / 2 - u / .62 * step; ang = slopeA(x + rel) + .45 * seg(u, .48, .62); }
    else { const v = (u - .62) / .38; rel = -step / 2 + eio(v) * step; lift = .14 * Math.sin(Math.PI * v); ang = slopeA(x + rel) + .45 * (1 - seg(v, 0, .4)) - .2 * Math.sin(Math.PI * v); }
    rel *= amp; lift *= amp; const fxw = x + rel;

  }
  if (amp < 1) { feet[0] = bl(feet[0], [x + .1, g + ANK, slopeA(x + .1)], 1 - amp); feet[1] = bl(feet[1], [x - .12, g + ANK, slopeA(x - .12)], 1 - amp); }

}
function solve(p) {
  const sh = [p.hip[0] + Math.sin(p.lean) * TOR, p.hip[1] + Math.cos(p.lean) * TOR];
  const leg = f => { const [kn, an] = ik(p.hip, [f[0], f[1]], LT, LS, 1); return { kn, an, fa: f[2] }; };
  const arm = h => {  // anatomik limit: bazu gövdəyə nisbətən ~20°-dən çox arxaya getmir, dirsək həmişə irəli bükülür
    const tg = [sh[0] + h[0], sh[1] + h[1]]; let [el, wr] = ik(sh, tg, LU, LF, -1);

}
// ---------------- insan silueti (yan görünüş, sağa baxır) ----------------
function cap(c, A, B, ra, rb) {  // konik kapsul (piksel)
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L;
  c.beginPath(); c.arc(A[0], A[1], ra, 0, 7); c.fill(); c.beginPath(); c.arc(B[0], B[1], rb, 0, 7); c.fill();
  c.beginPath(); c.moveTo(A[0] + nx * ra, A[1] + ny * ra); c.lineTo(B[0] + nx * rb, B[1] + ny * rb); c.lineTo(B[0] - nx * rb, B[1] - ny * rb); c.lineTo(A[0] - nx * ra, A[1] - ny * ra); c.closePath(); c.fill();
}
function smooth(c, pts) { c.beginPath(); const n = pts.length; c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); } c.closePath(); c.fill(); }

  else personRaw(c, J, o);
}
function personRaw(c, J, o) {

    cap(c, hp, kn, m(.088), m(.062)); cap(c, kn, mid, m(.062), m(.066)); cap(c, mid, an, m(.066), m(.042));
    // çəkmə

function litFigure(J, o, lights, base) {

// ---------------- M24: LIFTER (qaraj, ştanq) vs WAITER (divan, təqvim «MONDAY») ----------------
const T_SINK = T.sink;
const kg = d => Math.round(20 + 100 * Math.pow(Math.min(d, 365) / 365, .7) - (d > 30.5 ? 6 : 0) * (d < 45 ? 1 : 0));
function garageBG(t) {
  const { ox, oy, w, h } = C;
  let g = X.createLinearGradient(0, oy, 0, oy + h); g.addColorStop(0, '#0b0a0c'); g.addColorStop(1, '#151214'); X.fillStyle = g; X.fillRect(ox, oy, w, h);
  // beton divar xətləri
  X.strokeStyle = 'rgba(255,255,255,.035)'; X.lineWidth = 2; for (let y = sy(0); y > oy; y -= .45 * C.s) { X.beginPath(); X.moveTo(ox, y); X.lineTo(ox + w, y); X.stroke(); }

  const lx = sx(.25), ly = sy(2.35); X.strokeStyle = '#222'; X.lineWidth = 3; X.beginPath(); X.moveTo(lx, oy); X.lineTo(lx, ly - 10); X.stroke();
  X.save(); X.globalCompositeOperation = 'lighter'; let lg = X.createRadialGradient(lx, ly, 0, lx, ly + 200, 520); lg.addColorStop(0, 'rgba(255,190,110,.55)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = lg; X.fillRect(ox, oy, w, h);

function squatPose(t, d, fail) {

function lifterPanel(t) {

    X.save(); X.globalAlpha = 1 - r / .7;
    litFigure(J, { capH: true, puffy: 1.05, glow: 'rgba(255,190,110,.8)', gb: 22 }, [{ p: lamp, a: 1, r: 10, fill: 'rgba(255,180,90,A)', rim: 'rgb(255,214,150)', k: 1.4 }], '#15100c');
    // ştanq: yan görünüşdə disklər çiyində (yıxılanda yerə yuvarlanır)
    const w = kg(d), rad = (.12 + .2 * clamp((w - 20) / 100)) * C.s;
    let b = S([J.aN.wr[0] + .04, J.aN.wr[1] + .02]);
    if (fail > .05) { const u = clamp((t - T_SINK - .15) / .6); b = [lerp(b[0], sx(-.65), u), lerp(b[1], sy(0) - rad, eio(u))]; }
    X.fillStyle = '#1b1b1f'; X.beginPath(); X.arc(...b, rad, 0, 7); X.fill(); X.strokeStyle = 'rgba(255,200,130,.75)'; X.lineWidth = 3; X.stroke();
    X.beginPath(); X.arc(...b, rad * .7, 0, 7); X.strokeStyle = 'rgba(255,200,130,.25)'; X.stroke(); X.fillStyle = '#ddd'; X.beginPath(); X.arc(...b, 6, 0, 7); X.fill();
    X.font = '30px MO'; X.textAlign = 'center'; X.fillStyle = 'rgba(255,220,170,.9)'; X.fillText(`${w} KG`, sx(1.15), sy(1.9));
    X.restore();
  }
  const u5 = t - (T_SINK + .3); if (u5 > 0 && u5 < 1.4 && r === 0) { X.save(); X.globalAlpha = Math.min(1, u5 * 6) * (1 - seg(u5, 1, 1.4)); X.font = '52px MO'; X.textAlign = 'center'; X.fillStyle = RED; X.shadowColor = RED; X.shadowBlur = 16; X.fillText('−5', sx(-.9), P1 + 200 - u5 * 50); X.restore(); }
  if (r > 0) { const gx = dd => PX + 70 + dd / 365 * (PW - 160), gy = hh => P1 + 560 - hh / hgt(365) * 380;
    X.save(); X.globalAlpha = r; X.strokeStyle = 'rgba(255,255,255,.18)'; X.lineWidth = 2; X.setLineDash([6, 10]); X.beginPath(); X.moveTo(PX + 70, P1 + 560); X.lineTo(PX + PW - 60, P1 + 560); X.stroke(); X.setLineDash([]);
    let ag = X.createLinearGradient(0, P1 + 150, 0, P1 + 560); ag.addColorStop(0, 'rgba(247,192,74,.22)'); ag.addColorStop(1, 'rgba(247,192,74,0)'); X.fillStyle = ag;
    X.beginPath(); X.moveTo(gx(0), P1 + 560); for (let dd = 0; dd <= 365; dd += 1) X.lineTo(gx(dd), gy(hgt(dd))); X.lineTo(gx(365), P1 + 560); X.fill();
    X.lineCap = 'round'; X.lineJoin = 'round'; X.lineWidth = 5; X.shadowBlur = 18;
    let prev = null; for (let dd = 0; dd <= 365 * eout(r); dd += 1) { const p = [gx(dd), gy(hgt(dd))], dip = DIPS.some(c => Math.abs(dd - c) < 2); if (prev) { X.strokeStyle = dip ? RED : GOLD; X.shadowColor = X.strokeStyle; X.beginPath(); X.moveTo(...prev); X.lineTo(...p); X.stroke(); } prev = p; }

const TOP_PANEL = lifterPanel, BOT_PANEL = waiterPanel;

// ---------------- çərçivə, mətn ----------------
function panelClip(y, col, fn) {

}
const NOISE = [0, 1, 2].map(k => { const c = mk(540, 960), x = c.getContext('2d'), d = x.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R(i * .37 + k * 91.3) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
