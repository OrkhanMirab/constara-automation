<script>
/*TL*/
// M19 «Göl» (11-15): M14 «Fənər»in sadə bölünmüş ekran dizaynı (1.2K baxış) + M17 insan siluetləri.
// Yuxarı THE SWIMMER suya tullanır, batır (−5), pis üzür, sonra yaxşı; aşağı THE READER sahildə «HOW TO SWIM» oxuyur, kitablar yığılır.
// Sonda yuxarı panel geri çəkilir: üzmə yolu = Constara qrafiki (+355), oxucu 0. «You don't learn to swim on the shore.»
const T = window.TL, W = 1080, H = 1920, P1 = 330, P2 = 1050, PH = 660, PX = 30, PW = 1020;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const FIG = mk(), FX = FIG.getContext('2d'), RIM = mk(), RX = RIM.getContext('2d');
const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA', GREY = '#A7ADB5';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;

const eio = u => .5 - .5 * Math.cos(Math.PI * clamp(u));

const seg = (t, a, b) => clamp((t - a) / (b - a));
const bump = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

const SHORE = .35, G = x => x < 0 ? SHORE : -1.5, slopeA = x => 0;
let C = { cx: 0, cy: 0, s: 100 };
const sx = x => C.ox + C.w / 2 + (x - C.cx) * C.s, sy = y => C.oy + C.h / 2 - (y - C.cy) * C.s, S = p => [sx(p[0]), sy(p[1])];
function dayAt(t) { const D = T.days; let d = D[0][1]; for (let i = 0; i < D.length - 1; i++) { const [a, d0] = D[i], [b, d1] = D[i + 1]; if (t >= a) { let u = clamp((t - a) / (b - a)); u = u * u * (3 - 2 * u); d = d0 + (d1 - d0) * u; } } return d; }
const DIPS = [30.5, 121];
const sig = x => 1 / (1 + Math.exp(-x * 2.2));
const hgt = d => .95 * d + 10 * Math.sin(d / 7) - 34 * sig(d - DIPS[0]) - 28 * sig(d - DIPS[1]);
const score = d => Math.round(d - 5 * DIPS.filter(c => d > c).length);
// ---------------- IK + poza ----------------
function ik(A, Tg, l1, l2, side) {

  const c = Math.acos(clamp((l1 * l1 + dm * dm - l2 * l2) / (2 * l1 * dm), -1, 1)), an = a + side * c;

  return [J, [J[0] + Math.cos(b) * l2, J[1] + Math.sin(b) * l2]];
}
const LT = .485, LS = .47, ANK = .085, LU = .3, LF = .27, TOR = .52;
function bl(a, b, u) { if (typeof a === "number") return lerp(a, b, u); if (Array.isArray(a)) return a.map((v, i) => lerp(v, b[i], u)); const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' || Array.isArray(a[k]) ? bl(a[k], b[k], u) : a[k]; return o; }
function walkPose(x, amp, lantern) {
  const g = G(x), ph = x / T.stride * Math.PI * 2, step = T.stride / 2, feet = [];
  for (let i = 0; i < 2; i++) {
    const u = ((ph / (2 * Math.PI) + i * .5) % 1 + 1) % 1; let rel, lift = 0, ang;
    if (u < .62) { rel = step / 2 - u / .62 * step; ang = slopeA(x + rel) + .45 * seg(u, .48, .62); }
    else { const v = (u - .62) / .38; rel = -step / 2 + eio(v) * step; lift = .14 * Math.sin(Math.PI * v); ang = slopeA(x + rel) + .45 * (1 - seg(v, 0, .4)) - .2 * Math.sin(Math.PI * v); }

  for (const f of feet) hy = Math.min(hy, f[1] + Math.sqrt(Math.max(0, .935 * .935 - (f[0] - x) ** 2)));

    hN: lantern ? [.2 + .02 * Math.sin(ph), -.47] : [.55 * Math.sin(-a), -.55 * Math.cos(a)], hF: [.55 * Math.sin(a), -.55 * Math.cos(a)] };
}
function solve(p) {
  const sh = [p.hip[0] + Math.sin(p.lean) * TOR, p.hip[1] + Math.cos(p.lean) * TOR];
  const leg = f => { const [kn, an] = ik(p.hip, [f[0], f[1]], LT, LS, 1); return { kn, an, fa: f[2] }; };
  const arm = h => { const [el, wr] = ik(sh, [sh[0] + h[0], sh[1] + h[1]], LU, LF, -1); return { el, wr }; };
  const nb = [sh[0] + Math.sin(p.lean) * .05, sh[1] + Math.cos(p.lean) * .05], ha = p.lean * .55 + p.head;
  return { hip: p.hip, sh, lean: p.lean, nb, head: [nb[0] + Math.sin(ha) * .15 + .015, nb[1] + Math.cos(ha) * .15], ha, N: leg(p.fN), Fa: leg(p.fF), aN: arm(p.hN), aF: arm(p.hF) };
}
// ---------------- insan silueti (yan görünüş, sağa baxır) ----------------
function cap(c, A, B, ra, rb) {  // konik kapsul (piksel)
  const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L;
  c.beginPath(); c.arc(A[0], A[1], ra, 0, 7); c.fill(); c.beginPath(); c.arc(B[0], B[1], rb, 0, 7); c.fill();
  c.beginPath(); c.moveTo(A[0] + nx * ra, A[1] + ny * ra); c.lineTo(B[0] + nx * rb, B[1] + ny * rb); c.lineTo(B[0] - nx * rb, B[1] - ny * rb); c.lineTo(A[0] - nx * ra, A[1] - ny * ra); c.closePath(); c.fill();
}
function smooth(c, pts) { c.beginPath(); const n = pts.length; c.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); } c.closePath(); c.fill(); }
function person(c, J, o) {
  if (J.dir === -1 || o.k) { const gx = sx(J.hip[0]), gy = sy(J.gy ?? 0); c.save(); c.translate(gx, gy); c.scale(J.dir === -1 ? -(o.k || 1) : (o.k || 1), o.k || 1); c.translate(-gx, -gy); personRaw(c, J, o); c.restore(); }
  else personRaw(c, J, o);
}
function personRaw(c, J, o) {
  const s = C.s, m = v => v * s, w2s = p => S(p);
  const leg = (L, far) => {
    const hp = w2s(J.hip), kn = w2s(L.kn), an = w2s(L.an), mid = [lerp(kn[0], an[0], .35) - (an[1] - kn[1]) * .03, lerp(kn[1], an[1], .35)];
    cap(c, hp, kn, m(.088), m(.062)); cap(c, kn, mid, m(.062), m(.066)); cap(c, mid, an, m(.066), m(.042));
    // çəkmə
    const fa = L.fa, ca = Math.cos(fa), sa = Math.sin(fa), q = (u, v) => S([L.an[0] + ca * u - sa * v, L.an[1] + sa * u + ca * v]);
    smooth(c, [q(-.06, .05), q(-.085, -.02), q(-.075, -.085), q(.08, -.088), q(.19, -.082), q(.205, -.045), q(.15, -.02), q(.06, .025), q(.03, .06)]);
  };
  const arm = (A, far) => { const sh = w2s(J.sh), el = w2s(A.el), wr = w2s(A.wr); cap(c, sh, el, m(.064), m(.05)); cap(c, el, wr, m(.05), m(.038));
    const d = [wr[0] - el[0], wr[1] - el[1]], L = Math.hypot(...d) || 1; c.beginPath(); c.ellipse(wr[0] + d[0] / L * m(.055), wr[1] + d[1] / L * m(.055), m(.065), m(.045), Math.atan2(d[1], d[0]), 0, 7); c.fill(); };

    const u = [J.sh[0] - J.hip[0], J.sh[1] - J.hip[1]], L = Math.hypot(...u), ux = u[0] / L, uy = u[1] / L, vx = uy, vy = -ux;
    const q = (a, b) => S([J.hip[0] + ux * a * L + vx * b, J.hip[1] + uy * a * L + vy * b]), k = o.puffy || 1;
    smooth(c, [q(-.05, -.13 * k), q(.16, -.14 * k), q(.42, -.1 * k), q(.74, -.12 * k), q(.98, -.075 * k), q(1.04, .02), q(.9, .11 * k), q(.66, .135 * k), q(.42, .11 * k), q(.16, .115 * k), q(-.05, .1 * k)]);
    if (o.pack) { const pc = q(.6, -.2), a = Math.atan2(-(uy), ux) + Math.PI / 2; c.save(); c.translate(...pc); c.rotate(-Math.atan2(uy, ux) + Math.PI / 2); c.beginPath(); c.roundRect(-m(.11), -m(.2), m(.2), m(.4), m(.06)); c.fill(); c.restore(); }
    return q;
  };

    const hc = w2s(J.head), nb = w2s(J.nb); cap(c, nb, [lerp(nb[0], hc[0], .7), lerp(nb[1], hc[1], .7)], m(.062), m(.054));
    c.save(); c.translate(...hc); c.rotate(J.ha * 1);
    const pt = (u, v) => [m(u), -m(v)];
    c.beginPath(); c.ellipse(0, -m(.005), m(.098), m(.118), 0, 0, 7); c.fill();
    smooth(c, [pt(.0, .1), pt(.06, .085), pt(.097, .04), pt(.1, .012), pt(.124, -.018), pt(.1, -.036), pt(.106, -.062), pt(.094, -.09), pt(.084, -.112), pt(.035, -.132), pt(-.04, -.1), pt(-.06, .0)]);
    if (o.beanie) { c.beginPath(); c.ellipse(-m(.005), -m(.05), m(.108), m(.095), -.15, Math.PI, 2 * Math.PI); c.fill(); c.beginPath(); c.roundRect(-m(.11), -m(.06), m(.21), m(.035), m(.01)); c.fill(); }
    if (o.hair) { c.beginPath(); c.ellipse(-m(.01), -m(.045), m(.106), m(.09), -.2, Math.PI * .95, 2.05 * Math.PI); c.fill(); c.beginPath(); c.ellipse(-m(.07), -m(.02), m(.045), m(.06), .3, 0, 7); c.fill(); }
    if (o.long) { c.beginPath(); c.ellipse(-m(.03), -m(.03), m(.11), m(.1), -.2, Math.PI * .9, 2.1 * Math.PI); c.fill(); c.beginPath(); c.roundRect(-m(.13), -m(.05), m(.1), m(.3), m(.04)); c.fill(); }

function litFigure(J, o, lights, base) {
  // yalnız fiqurun çərçivəsində işlə (telefonda sürət üçün)
  let pts = [J.hip, J.sh, J.head, J.N.kn, J.N.an, J.Fa.kn, J.Fa.an, J.aN.el, J.aN.wr, J.aF.el, J.aF.wr].map(S); const hx = sx(J.hip[0]); pts = pts.concat(pts.map(p => [2 * hx - p[0], p[1]])); const mg = .55 * C.s * (o.k || 1) + 12;
  let bx = Math.max(0, Math.floor(Math.min(...pts.map(p => p[0])) - mg)), by = Math.max(0, Math.floor(Math.min(...pts.map(p => p[1])) - mg));
  let bw = Math.min(W, Math.ceil(Math.max(...pts.map(p => p[0])) + mg)) - bx, bh = Math.min(H, Math.ceil(Math.max(...pts.map(p => p[1])) + mg)) - by;
  if (bw <= 0 || bh <= 0) return;

    g.addColorStop(0, L.fill.replace('A', (.32 * L.a).toFixed(3))); g.addColorStop(1, L.fill.replace('A', '0')); FX.fillStyle = g; FX.fillRect(bx, by, bw, bh);

  }

  X.drawImage(FIG, bx, by, bw, bh, bx, by, bw, bh);
}


// ---------------- göl fonu ----------------
const STARS = Array.from({ length: 160 }, (_, i) => [R(i * 3 + 1), R(i * 3 + 2) * .55, .5 + Math.pow(R(i * 3 + 3), 5) * 2]);
function lakeBG(t, par) {
  const { ox, oy, w, h } = C;
  let g = X.createLinearGradient(0, oy, 0, oy + h); g.addColorStop(0, '#05070c'); g.addColorStop(.55, '#0d1424'); g.addColorStop(1, '#05070a'); X.fillStyle = g; X.fillRect(ox, oy, w, h);
  for (const [a, b, r] of STARS) { X.fillStyle = `rgba(225,232,255,${.25 + .5 * (r - .5) / 2})`; X.fillRect(ox + ((a * w - C.cx * par * 3) % w + w) % w, oy + b * h, r, r); }
  const mx = ox + w * .78, my = oy + h * .16; let m = X.createRadialGradient(mx, my, 0, mx, my, 200); m.addColorStop(0, 'rgba(170,190,230,.25)'); m.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = m; X.fillRect(ox, oy, w, h);
  X.fillStyle = '#e8ecf5'; X.beginPath(); X.arc(mx, my, 24, 0, 7); X.fill();
  // uzaq sahil (qarşı tərəf)
  const hy = sy(.25); X.fillStyle = '#0a0e17'; X.beginPath(); X.moveTo(ox, hy);
  for (let x = 0; x <= w; x += 10) X.lineTo(ox + x, hy - 30 - 22 * Math.sin((x + C.cx * par * 6) / 90) - 14 * Math.sin((x + C.cx * par * 9) / 37)); X.lineTo(ox + w, hy); X.fill();
  return { mx, my };
}
function water(t, moon, alpha = .82) {
  const { ox, oy, w, h } = C, wy = sy(0);
  if (wy > oy + h) return;
  let g = X.createLinearGradient(0, wy, 0, oy + h); g.addColorStop(0, `rgba(16,28,48,${alpha})`); g.addColorStop(1, `rgba(4,7,12,${Math.min(1, alpha + .12)})`);
  X.fillStyle = g; X.fillRect(ox, wy, w, oy + h - wy);
  // ay əksi
  X.save(); X.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 18; k++) { const y = wy + 6 + k * k * 1.6; if (y > oy + h) break; const ww = 50 + k * 9 + 20 * Math.sin(t * 2 + k); X.fillStyle = `rgba(170,190,230,${.16 * (1 - k / 18)})`; X.fillRect(moon.mx - ww / 2 + 12 * Math.sin(t * 1.3 + k * 1.7), y, ww, 2); }
  X.restore();
  X.strokeStyle = 'rgba(160,185,225,.35)'; X.lineWidth = 2; X.beginPath();
  for (let x = 0; x <= w; x += 8) { const wx = (x - w / 2) / C.s + C.cx, yy = wy + Math.sin(wx * 4 + t * 2.4) * 1.6; x ? X.lineTo(ox + x, yy) : X.moveTo(ox, yy); } X.stroke();
}
function shoreLand() {
  const { ox, oy, w, h } = C, x0 = sx(0); if (x0 < ox) return;
  X.fillStyle = '#0b0c10'; X.beginPath(); X.moveTo(ox - 5, sy(SHORE)); X.lineTo(x0 - 6, sy(SHORE)); X.quadraticCurveTo(x0 + 14, sy(SHORE) + 10, x0 + 18, sy(-.3)); X.lineTo(x0 + 18, oy + h); X.lineTo(ox - 5, oy + h); X.fill();
  X.strokeStyle = 'rgba(150,170,210,.25)'; X.lineWidth = 2; X.beginPath(); X.moveTo(ox, sy(SHORE)); X.lineTo(x0 - 6, sy(SHORE)); X.stroke();
}
function ripples(t, x, y, k, a) {  // dairəvi dalğalar
  X.save(); X.strokeStyle = `rgba(190,210,240,${.5 * a})`; X.lineWidth = 2;
  for (let i = 0; i < k; i++) { const u = ((t * .9 + i / k) % 1), r = (.2 + u * 1.2) * C.s; X.globalAlpha = (1 - u) * a; X.beginPath(); X.ellipse(sx(x), sy(y), r, r * .18, 0, 0, 7); X.stroke(); }
  X.restore();
}
function splash(t, t0, x) {  // tullanma sıçrayışı
  const u = t - t0; if (u < 0 || u > 1.1) return; X.save(); X.fillStyle = 'rgba(210,225,250,.9)';
  for (let i = 0; i < 40; i++) { const a = -Math.PI / 2 + (R(i) - .5) * 2.2, v = 2.5 + R(i + 9) * 3, px = x + Math.cos(a) * v * u, py = Math.sin(-a) * v * u - 4.9 * u * u;
    if (py < -.05) continue; X.globalAlpha = 1 - u / 1.1; X.beginPath(); X.arc(sx(px), sy(py), Math.max(1.5, .025 * C.s), 0, 7); X.fill(); }
  X.restore(); ripples(t * 1.4, x, 0, 3, 1 - u / 1.1);
}
function bubbles(t, x, y, a) { X.save(); X.fillStyle = 'rgba(200,220,255,.6)'; for (let i = 0; i < 14; i++) { const u = (t * 1.3 + R(i)) % 1; X.globalAlpha = a * (1 - u); X.beginPath(); X.arc(sx(x + (R(i + 3) - .5) * .5 + .1 * Math.sin(t * 5 + i)), sy(y + u * (0 - y)), 3 + 3 * R(i), 0, 7); X.fill(); } X.restore(); }

// ---------------- SWIMMER ----------------
const T_JUMP = T.jump, T_SINK = T.sink;
const swimX = d => .9 + 58 * Math.pow(d / 365, 1.15);
function swimPose(t, d) {
  const x = swimX(d), skill = clamp((d - 5) / 120), sinking = bump(t, T_SINK + .55, .45);
  const ph = t * 6.2 + (1 - skill) * .5 * Math.sin(t * 2.3);  // faza həmişə irəli (tezlik sabit; əvvəl nizamsız)  // əvvəl nizamsız, sonra ritmik
  const y = -.08 - sinking * .85 + .03 * Math.sin(ph * 2);
  const lean = lerp(1.05, 1.6, skill) - sinking * .9, hipX = x - .5;
  const arm = (p) => { const a = Math.PI - p; return [.55 * Math.cos(a), .55 * Math.sin(a)]; };  // krol: arxa → üstdən qabağa → suyun altından geri (saat əqrəbi)
  const kick = Math.sin(ph * 2) * lerp(.18, .09, skill);
  let p = { hip: [hipX, y], lean, head: lerp(-.85, -1.05, skill) + sinking * .9,
    fN: [hipX - .86, y - .05 + kick, Math.PI - .2], fF: [hipX - .86, y - .05 - kick, Math.PI - .2], hN: arm(ph), hF: arm(ph + Math.PI) };
  if (sinking > .05) { p.hN = bl(p.hN, [.15, .55 + .1 * Math.sin(t * 13)], sinking); p.hF = bl(p.hF, [-.1, .5 + .1 * Math.cos(t * 11)], sinking); }
  return { x: hipX, y, p, sinking, ph };
}
function standPose(x, lookUp) {

}
function swimmerState(t) {

    return { d, mode: 'stand', J: solve(standPose(-.35, .2)), x: -.35, y: SHORE };
  }
  if (t < T_JUMP + .75) { // qaçış + dalış
    const u = (t - T_JUMP) / .75, st = standPose(-.35, 0), s = swimPose(T_JUMP + .75, dayAt(T_JUMP + .75));
    const dive = { ...st, hip: [lerp(-.35, s.x, u), lerp(SHORE + .95, s.y, u) + Math.sin(Math.PI * u) * .55], lean: lerp(.2, 1.7, eio(u)), head: -.2,
      hN: [.55, .25], hF: [.55, .22], fN: [lerp(-.25, s.x - .9, u), lerp(SHORE + ANK, s.y, u) + Math.sin(Math.PI * u) * .4, Math.PI * u], fF: [lerp(-.45, s.x - .92, u), lerp(SHORE + ANK, s.y, u) + Math.sin(Math.PI * u) * .35, Math.PI * u] };

function swimmerPanel(t) {
  const d = dayAt(t), st = swimmerState(t), r = ease(seg(t, T.reveal, T.reveal + 1.8));

  const moonL = { p: [moon.mx, moon.my], a: .7, r: 10, fill: 'rgba(0,0,0,A)', rim: 'rgb(170,190,230)', k: 1.2 };
  litFigure(st.J, { hair: true, puffy: .9, glow: 'rgba(255,200,110,.9)' }, [{ ...moonL, rim: 'rgb(255,248,225)', a: .9 }], '#FFD98A');
  water(t, moon, .55);

  splash(t, T_JUMP + .72, .9);

  // −5
  const u5 = t - (T_SINK + .3); if (u5 > 0 && u5 < 1.4 && r === 0) { X.save(); X.globalAlpha = Math.min(1, u5 * 6) * (1 - seg(u5, 1, 1.4)); X.font = '52px MO'; X.textAlign = 'center'; X.fillStyle = RED; X.shadowColor = RED; X.shadowBlur = 16; X.fillText('−5', sx(st.x + .4), P1 + 200 - u5 * 50); X.restore(); }
  // REVEAL: qrafik
  if (r > 0) { const gx = dd => PX + 70 + dd / 365 * (PW - 160), gy = hh => P1 + 560 - hh / hgt(365) * 380;
    X.save(); X.globalAlpha = r; X.strokeStyle = 'rgba(255,255,255,.18)'; X.lineWidth = 2; X.setLineDash([6, 10]); X.beginPath(); X.moveTo(PX + 70, P1 + 560); X.lineTo(PX + PW - 60, P1 + 560); X.stroke(); X.setLineDash([]);
    let ag = X.createLinearGradient(0, P1 + 150, 0, P1 + 560); ag.addColorStop(0, 'rgba(247,192,74,.22)'); ag.addColorStop(1, 'rgba(247,192,74,0)'); X.fillStyle = ag;
    X.beginPath(); X.moveTo(gx(0), P1 + 560); for (let dd = 0; dd <= 365; dd += 1) X.lineTo(gx(dd), gy(hgt(dd))); X.lineTo(gx(365), P1 + 560); X.fill();
    X.lineCap = 'round'; X.lineJoin = 'round'; X.lineWidth = 5; X.shadowBlur = 18;
    let prev = null; for (let dd = 0; dd <= 365 * eout(r); dd += 1) { const p = [gx(dd), gy(hgt(dd))], dip = DIPS.some(c => Math.abs(dd - c) < 2); if (prev) { X.strokeStyle = dip ? RED : GOLD; X.shadowColor = X.strokeStyle; X.beginPath(); X.moveTo(...prev); X.lineTo(...p); X.stroke(); } prev = p; }
    X.shadowBlur = 0; X.font = '24px MO'; X.fillStyle = 'rgba(220,220,220,.6)'; X.textAlign = 'left'; X.fillText('DAY 1', PX + 60, P1 + 595); X.textAlign = 'right'; X.fillText('DAY 365', PX + PW - 60, P1 + 595);
    X.font = '52px MO'; X.fillStyle = GOLD; X.shadowColor = GOLD; X.shadowBlur = 22; X.fillText('+' + score(365), PX + PW - 70, gy(hgt(365)) + 70); X.restore(); }
  return st;
}

// ---------------- READER ----------------
function bookCount(d) { return 1 + Math.floor(d / 9); }
function readerPanel(t) {
  const d = dayAt(t), n = bookCount(d), look = seg(t, T.reveal + .2, T.reveal + 1.0), r = seg(t, T.reveal, T.reveal + 1);
  C = { ox: PX, oy: P2, w: PW, h: PH, cx: -1.5, cy: .85, s: 215 };
  const moon = lakeBG(t, 0); water(t, moon, .82); shoreLand();
  // qaya
  const RX0 = -1.9; X.fillStyle = '#121419'; X.beginPath(); X.ellipse(sx(RX0), sy(SHORE + .2), .42 * C.s, .26 * C.s, 0, Math.PI, 2 * Math.PI); X.fill(); X.fillRect(sx(RX0) - .42 * C.s, sy(SHORE + .2), .84 * C.s, .2 * C.s);
  // kitab yığını
  for (let k = 0; k < n - 1; k++) { const bx = sx(-3.15 + (R(k) - .5) * .06), by = sy(SHORE) - (k + 1) * .055 * C.s, bw = (.42 + .08 * R(k + 4)) * C.s;
    X.fillStyle = ['#2a3550', '#4a2c2a', '#2c4a3a', '#4a4330', '#352a4a'][k % 5]; X.fillRect(bx - bw / 2 + (R(k + 9) - .5) * 8, by, bw, .05 * C.s - 1);
    X.fillStyle = 'rgba(230,220,200,.5)'; X.fillRect(bx - bw / 2 + (R(k + 9) - .5) * 8 + 4, by + 3, bw - 8, 1.5); }
  // oxucu: qayada oturur
  const p = { hip: [RX0, SHORE + .2 + .1], lean: lerp(.38, .05, look), head: lerp(.55, -.35, look), fN: [RX0 + .5, SHORE + ANK, 0], fF: [RX0 + .42, SHORE + ANK, 0],
    hN: [lerp(.33, .25, look), lerp(-.06, -.3, look)], hF: [lerp(.3, .2, look), lerp(-.05, -.3, look)] };
  const J = solve(p);
  litFigure(J, { hair: true, puffy: .95, glow: 'rgba(150,170,200,.5)', gb: 16 }, [{ p: [moon.mx, moon.my], a: .6, r: 10, fill: 'rgba(0,0,0,A)', rim: 'rgb(235,240,250)', k: 1.2 },
    { p: S([RX0 + .45, SHORE + 1.1]), a: .6 * (1 - look * .6), r: .6 * C.s, r2: .8 * C.s, fill: 'rgba(255,230,180,A)', rim: 'rgb(255,235,200)', k: .9 }], '#B8BDC4');
  // kitab (açıq, əllərdə)
  const w1 = S(J.aN.wr), bx = w1[0] + 10, by = w1[1] - 28, ang = lerp(-.6, .5, look);
  X.save(); X.translate(bx, by); X.rotate(ang); X.fillStyle = '#e9e1cc'; X.beginPath(); X.moveTo(0, 0); X.lineTo(-38, -8); X.lineTo(-38, 38); X.lineTo(0, 46); X.closePath(); X.fill();
  X.fillStyle = '#d8cfb6'; X.beginPath(); X.moveTo(0, 0); X.lineTo(36, -8); X.lineTo(36, 38); X.lineTo(0, 46); X.closePath(); X.fill();
  const pg = (t * .9) % 1; if (pg < .25 && look < .5) { X.fillStyle = 'rgba(250,245,230,.9)'; X.beginPath(); X.moveTo(0, 0); X.lineTo(36 * Math.cos(pg * Math.PI * 4), -8); X.lineTo(36 * Math.cos(pg * Math.PI * 4), 38); X.lineTo(0, 46); X.fill(); }
  X.restore();
  X.save(); X.globalCompositeOperation = 'lighter'; let lg = X.createRadialGradient(bx, by + 20, 2, bx, by + 20, 120); lg.addColorStop(0, `rgba(255,230,180,${.25 * (1 - look * .6)})`); lg.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = lg; X.fillRect(bx - 130, by - 110, 260, 260); X.restore();
  // etiket: kitab nömrəsi

  if (r > 0) { X.save(); X.globalAlpha = r; X.font = '52px MO'; X.fillStyle = GREY; X.textAlign = 'right'; X.fillText('0', PX + PW - 60, P2 + PH - 60); X.restore(); }
}

// ---------------- çərçivə, mətn ----------------
function panelClip(y, col, fn) {
  X.save(); X.beginPath(); X.roundRect(PX, y, PW, PH, 28); X.clip(); fn(); X.restore();
  X.save(); X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); X.roundRect(PX, y, PW, PH, 28); X.stroke(); X.restore();
}
function caption(t) {
  for (const [a, b, txt, hi, hc] of T.texts) {
    if (t < a || t > b) continue;
    const al = Math.min(seg(t, a, a + .25), 1 - seg(t, b - .2, b)), lines = txt.split('\n');
    X.save(); X.globalAlpha = al; X.font = (lines.length > 2 || txt.length > 40 ? '38px' : '46px') + ' MO'; X.letterSpacing = '3px'; X.textBaseline = 'middle';
    const lh = lines.length > 2 ? 56 : 64, y0 = 215 - (lines.length - 1) * lh / 2 + (1 - eout(seg(t, a, a + .35))) * 12;
    lines.forEach((ln, li) => { let x = W / 2 - X.measureText(ln).width / 2; const y = y0 + li * lh, i = ln.indexOf(hi);
      const parts = i < 0 ? [[ln, WHITE]] : [[ln.slice(0, i), WHITE], [hi, hc === 'red' ? RED : GOLD], [ln.slice(i + hi.length), WHITE]];
      for (const [p, c] of parts) { if (!p) continue; X.fillStyle = c; X.shadowColor = c === WHITE ? 'rgba(0,0,0,.6)' : c; X.shadowBlur = c === WHITE ? 8 : 18; X.fillText(p, x, y); x += X.measureText(p).width; } });
    X.restore();
  }
}
function pill(x, y, txt, col, bg, align) {
  X.save(); X.font = '28px MO'; X.letterSpacing = '3px'; const w = X.measureText(txt).width + 40, x0 = align === 'c' ? x - w / 2 : align === 'r' ? x - w : x;
  X.fillStyle = bg; X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); X.roundRect(x0, y - 26, w, 52, 26); X.fill(); X.stroke();
  X.fillStyle = col; X.textBaseline = 'middle'; X.fillText(txt, x0 + 20, y + 1); X.restore();
}
const NOISE = [0, 1, 2].map(k => { const c = mk(540, 960), x = c.getContext('2d'), d = x.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R(i * .37 + k * 91.3) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.shadowBlur = 0; X.letterSpacing = '0px';
  X.fillStyle = '#050506'; X.fillRect(0, 0, W, H);
  const d = dayAt(t);
  panelClip(P1, 'rgba(247,192,74,.35)', () => swimmerPanel(t));
  panelClip(P2, 'rgba(167,173,181,.25)', () => readerPanel(t));
  X.save(); X.font = '30px MO'; X.letterSpacing = '6px'; X.textBaseline = 'middle';
  X.fillStyle = GOLD; X.shadowColor = GOLD; X.shadowBlur = 14; X.fillText('THE SWIMMER', PX + 34, P1 + 46);
  X.fillStyle = GREY; X.shadowBlur = 0; X.fillText('THE READER', PX + 34, P2 + 46); X.restore();
  const sinkNow = bump(t, T_SINK + .55, .45) > .3;
  pill(PX + PW - 26, P1 + 46, `SCORE +${Math.max(0, score(d))}`, sinkNow ? RED : GOLD, 'rgba(20,16,8,.85)', 'r');

  let vg = X.createRadialGradient(540, 1000, 500, 540, 1000, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); X.fillStyle = vg; X.fillRect(0, 0, W, H);
  X.save(); X.globalAlpha = .04; X.drawImage(NOISE[Math.floor(t * 24) % 3], 0, 0, W, H); X.restore();
  caption(t);
  const ea = seg(t, T.end + .5, T.end + 1); if (ea > 0) { X.save(); X.globalAlpha = ea; X.fillStyle = 'rgba(225,220,205,.92)'; X.font = '34px MO'; X.letterSpacing = '6px'; X.textAlign = 'center'; X.fillText('@constara.app', W / 2 + 3, 1820); X.restore(); }
};
document.fonts.load('40px MO').then(() => document.fonts.ready).then(() => { window.draw(1.2); window.READY = true; });
