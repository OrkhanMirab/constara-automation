// ---------------- M23 «Bir çəkiliş»: fasiləsiz kamera, fəsillər, REWIND ----------------
const X0 = 2.8, xOf = d => X0 + .165 * (d - 1), dOfX = x => 1 + (x - X0) / .165;

  [170, [20, 30, 54], [60, 80, 90], [16, 24, 16]], [280, [26, 22, 52], [150, 90, 90], [24, 18, 16]], [365, [40, 40, 80], [255, 160, 90], [30, 20, 18]]];
