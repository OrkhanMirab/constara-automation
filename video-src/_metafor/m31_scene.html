<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
@font-face{font-family:IM;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*TL*/
// M31 «Latte» (11-19) — YENİ MOTION ÜSLUBU: düz vektor illüstrasiya, yay (spring) easing, söz-söz kinetik yazı,
// dairəvi keçid (wipe), hər hadisəyə «squash» reaksiyası. Mövzu: finans (Constara bağı yoxdur — səhifə strategiyası 11-19).
const T = window.TL, W = 1080, H = 1920;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const INK = '#1E2533', CREAM = '#FBF3E6', MINT = '#E6F6EC', ORANGE = '#FF6B35', GREEN = '#17A862', GOLD = '#F2B233', GOLDD = '#C98A12', GREY = '#9AA3AE';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eout = u => 1 - Math.pow(1 - clamp(u), 3);
const eio = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const spring = (u, k = 7, f = 11) => u <= 0 ? 0 : 1 - Math.exp(-k * u) * Math.cos(f * u);   // overshoot → oturur
const R = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const money = v => '$' + Math.round(v).toLocaleString('en-US');
const FV = y => 1825 * (Math.pow(1.07, y) - 1) / .07;            // $5/gün, 7%/il
const S = T.s;                                                       // səhnə vaxtları

// ---------- kinetik yazı: söz-söz yay ilə gəlir, yuxarı sürüşüb gedir ----------
function words(str, cx, y, size, t, t0, t1, col, hi) {
  const ws = str.split(' '); X.font = `${size}px IB`;
  const sp = size * .28, wid = ws.map(w => X.measureText(w).width);
  let x = cx - (wid.reduce((a, b) => a + b, 0) + sp * (ws.length - 1)) / 2;
  ws.forEach((w, i) => {
    const a = spring(t - t0 - i * .07), out = eio(seg(t, t1 - .25 + i * .03, t1 + .05 + i * .03));
    if (a <= 0 || out >= 1) { x += wid[i] + sp; return; }
    X.save(); X.globalAlpha = clamp(a * 1.6) * (1 - out);
    X.translate(x + wid[i] / 2, y + (1 - a) * size * .9 - out * size * .8);
    X.scale(lerp(.6, 1, clamp(a)), lerp(.6, 1, clamp(a)));
    X.fillStyle = hi && hi.includes(w) ? hi[hi.length - 1] : col; X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(w, 0, 0); X.restore(); x += wid[i] + sp;
  });
}
function caption(t) { for (const [a, b, s, sz, hi] of T.texts) if (t > a - .1 && t < b + .3) s.split('|').forEach((ln, i, L) => words(ln, W / 2, 380 + (i - (L.length - 1) / 2) * sz * 1.15, sz, t, a + i * .18, b, INK, hi)); }

// ---------- obyektlər ----------
function coin(x, y, r, tilt = .42, a = 1) {
  if (a <= 0) return; X.save(); X.globalAlpha = a;
  const ry = r * tilt, th = r * .16;
  X.fillStyle = GOLDD; X.beginPath(); X.ellipse(x, y + th, r, ry, 0, 0, 7); X.fill(); X.fillRect(x - r, y, r * 2, th);
  const g = X.createLinearGradient(x - r, y - ry, x + r, y + ry); g.addColorStop(0, '#FFD970'); g.addColorStop(1, GOLD);
  X.fillStyle = g; X.beginPath(); X.ellipse(x, y, r, ry, 0, 0, 7); X.fill();
  X.strokeStyle = 'rgba(201,138,18,.6)'; X.lineWidth = r * .07; X.beginPath(); X.ellipse(x, y, r * .74, ry * .74, 0, 0, 7); X.stroke();
  if (tilt > .7) { X.fillStyle = GOLDD; X.font = `${r * 1.0}px IB`; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('$', x, y + r * .04); }
  X.restore();
}
function cup(x, y, s, t, squash) {                // y = fincanın dibi
  X.save(); X.translate(x, y); X.scale(s * (1 + squash * .5), s * (1 - squash));
  X.fillStyle = 'rgba(30,37,51,.10)'; X.beginPath(); X.ellipse(0, 6, 150, 22, 0, 0, 7); X.fill();
  const tw = 150, bw = 112, h = 380;
  X.fillStyle = '#FFFFFF'; X.beginPath(); X.moveTo(-bw, 0); X.lineTo(-tw, -h); X.lineTo(tw, -h); X.lineTo(bw, 0); X.closePath(); X.fill();
  X.fillStyle = 'rgba(30,37,51,.06)'; X.beginPath(); X.moveTo(40, 0); X.lineTo(60, -h); X.lineTo(tw, -h); X.lineTo(bw, 0); X.fill();
  X.fillStyle = ORANGE; X.beginPath(); X.moveTo(-bw - 18, -115); X.lineTo(-tw + 4, -265); X.lineTo(tw - 4, -265); X.lineTo(bw + 18, -115); X.closePath(); X.fill();
  X.fillStyle = '#FFF4E8'; X.beginPath(); X.arc(0, -190, 42, 0, 7); X.fill();
  X.fillStyle = ORANGE; X.font = '50px IB'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('$', 0, -188);
  X.fillStyle = '#5A4636'; X.beginPath(); X.roundRect(-tw - 14, -h - 34, 2 * tw + 28, 38, 14); X.fill();
  X.beginPath(); X.roundRect(-tw + 16, -h - 64, 2 * tw - 32, 34, 12); X.fill();
  X.restore();
  X.save(); X.strokeStyle = 'rgba(90,70,54,.35)'; X.lineWidth = 9 * s; X.lineCap = 'round';      // buxar
  for (let i = 0; i < 3; i++) {
    const ph = (t * .55 + i / 3) % 1; X.globalAlpha = Math.sin(Math.PI * ph) * .9; X.beginPath();
    for (let k = 0; k <= 12; k++) { const u = k / 12, yy = y - (470 + ph * 160 + u * 140) * s; X.lineTo(x + (i - 1) * 55 * s + Math.sin(u * 6 + t * 3 + i) * 16 * s, yy); }
    X.stroke();
  }
  X.restore();
}
// ---------- S3: hər gün bir sikkə fincana uçur ----------
const SP = []; { let t = S.coins, dt = .5; while (t < S.invest - .55) { SP.push(t); t += dt; dt = Math.max(.035, dt * .84); } }
const dayOf = t => { const u = seg(t, S.coins, S.invest - .5); return Math.max(1, Math.round(1 + 364 * Math.pow(u, 2.2))); };
function squashAt(t) { let q = 0; for (const s of SP) { const d = t - s - .42; if (d > 0 && d < .5) q += Math.exp(-d * 9) * Math.sin(d * 30) * .06; } return clamp(q, -.08, .1); }

// ---------- S4: qrafik kartı ----------
function graph(t) {
  const a = spring(t - S.invest - .3, 6, 9); if (a <= 0) return;
  const out = eio(seg(t, S.pile - .35, S.pile)), x0 = 120, x1 = 960, y0 = 1420, y1 = 760;
  X.save(); X.translate(W / 2, 1100); X.scale(lerp(.7, 1, clamp(a)) * (1 + out * 2.2), lerp(.7, 1, clamp(a)) * (1 + out * 2.2)); X.translate(-W / 2, -1100);
  X.globalAlpha = clamp(a * 1.5) * (1 - out);
  X.fillStyle = 'rgba(23,168,98,.13)'; X.beginPath(); X.roundRect(76, 646, 940, 900, 44); X.fill();
  X.fillStyle = '#fff'; X.beginPath(); X.roundRect(60, 620, 960, 900, 44); X.fill();
  const px = y => lerp(x0, x1, y / 30), py = v => lerp(y0, y1, v / 180000);
  X.strokeStyle = 'rgba(30,37,51,.08)'; X.lineWidth = 3;
  for (let v = 50000; v <= 150000; v += 50000) { X.beginPath(); X.moveTo(x0, py(v)); X.lineTo(x1, py(v)); X.stroke(); }
  X.fillStyle = GREY; X.font = '30px IM'; X.textAlign = 'center';
  [0, 10, 20, 30].forEach(y => X.fillText(y ? 'YEAR ' + y : 'NOW', px(y), y0 + 58));
  const g = eio(seg(t, S.draw, S.drawEnd)), Y = 30 * g;
  // döşək altında (sadəcə yığmaq) — boz qırıq xətt
  X.setLineDash([16, 14]); X.strokeStyle = GREY; X.lineWidth = 7; X.beginPath(); X.moveTo(px(0), py(0)); X.lineTo(px(Y), py(1825 * Y)); X.stroke(); X.setLineDash([]);
  // investisiya — yaşıl əyri + sahə
  X.beginPath(); X.moveTo(px(0), py(0)); for (let k = 0; k <= 90; k++) { const y = Y * k / 90; X.lineTo(px(y), py(FV(y))); }
  X.save(); X.lineTo(px(Y), y0); X.lineTo(px(0), y0); X.closePath();
  const gr = X.createLinearGradient(0, y1, 0, y0); gr.addColorStop(0, 'rgba(23,168,98,.35)'); gr.addColorStop(1, 'rgba(23,168,98,0)'); X.fillStyle = gr; X.fill(); X.restore();
  X.beginPath(); X.moveTo(px(0), py(0)); for (let k = 0; k <= 90; k++) { const y = Y * k / 90; X.lineTo(px(y), py(FV(y))); }
  X.strokeStyle = GREEN; X.lineWidth = 12; X.lineJoin = 'round'; X.lineCap = 'round'; X.stroke();
  // 10 / 20 il nişanları
  [[10, S.draw + .35 * (S.drawEnd - S.draw)], [20, S.draw + .68 * (S.drawEnd - S.draw)]].forEach(([y, tm]) => {
    const p = spring(t - tm, 8, 12); if (p <= 0) return;
    X.fillStyle = GREEN; X.beginPath(); X.arc(px(y), py(FV(y)), 12 * p, 0, 7); X.fill();
    X.globalAlpha = clamp(p) * (1 - out); X.fillStyle = INK; X.font = '40px IB'; X.fillText('$' + Math.round(FV(y) / 1000) + 'K', px(y), py(FV(y)) - 40 * p);
    X.globalAlpha = clamp(a * 1.5) * (1 - out);
  });
  // hərəkətli nöqtə + qiymət baloncuğu
  if (g > 0) {
    const bx = px(Y), by = py(FV(Y)), pul = 1 + .25 * Math.sin(t * 9);
    X.fillStyle = 'rgba(23,168,98,.25)'; X.beginPath(); X.arc(bx, by, 30 * pul, 0, 7); X.fill();
    X.fillStyle = GREEN; X.beginPath(); X.arc(bx, by, 17, 0, 7); X.fill();
    const lbl = money(FV(Y)); X.font = '54px IB'; const lw = X.measureText(lbl).width + 50, lx = Math.min(bx, x1 - lw / 2 + 30);
    X.fillStyle = INK; X.beginPath(); X.roundRect(lx - lw / 2, by - 128, lw, 80, 40); X.fill();
    X.fillStyle = '#fff'; X.fillText(lbl, lx, by - 70);
    if (g > .55) { X.globalAlpha *= seg(g, .55, .8); X.fillStyle = GREY; X.font = '34px IB'; X.textAlign = 'right'; X.fillText(money(1825 * Y) + ' SAVED', x1, py(1825 * Y) - 30); }
  }
  X.restore();
}
// ---------- S5: sikkə dağı ----------
const PILE = [];
for (let i = 0; i < 1100; i++) { const yy = Math.sqrt(R(i * 1.3)), half = 30 + 540 * yy; PILE.push([540 + (R(i * 5.9) - .5) * 2 * half, 1000 + yy * 640, R(i * 4.4)]); }
PILE.sort((a, b) => a[1] - b[1]);
function pile(t) {
  const a = seg(t, S.pile - .1, S.pile + .2); if (a <= 0) return;
  const z = eio(seg(t, S.pile, S.pile + 3.0)), sc = lerp(2.5, 1, z), fy = lerp(1230, 1180, z);
  const dim = 1 - .55 * eio(seg(t, S.twist, S.twist + .6)) * (1 - eio(seg(t, S.cta + 2.4, S.cta + 3.0)));
  X.save(); X.globalAlpha = a; X.translate(540, fy); X.scale(sc, sc); X.translate(-540, -1000);
  X.fillStyle = 'rgba(201,138,18,.18)'; X.beginPath(); X.ellipse(540, 1650, 600, 60, 0, 0, 7); X.fill();
  X.globalAlpha = a * dim;
  for (const [x, y, k] of PILE) coin(x, y, 30, .38 + k * .12);
  X.globalAlpha = a;
  cup(540, 1004, .42, t, 0);
  const g = eout(seg(t, S.twist + .3, S.twist + 1.0)) * (1 - eio(seg(t, S.cta + 2.4, S.cta + 3.0)));   // «görmədiyin kiçik şey»: bir sikkə parlayır
  if (g > 0) { const p = 1 + .08 * Math.sin(t * 6), rg = X.createRadialGradient(540, 760, 0, 540, 760, 150 * p);
    rg.addColorStop(0, `rgba(255,217,112,${.75 * g})`); rg.addColorStop(1, 'rgba(255,217,112,0)'); X.fillStyle = rg; X.beginPath(); X.arc(540, 760, 150 * p, 0, 7); X.fill();
    coin(540, 760 - 30 * g, 46 * p, .95, g); }
  X.restore();
}

// ---------- fon + keçidlər ----------
function bg(t) {
  X.fillStyle = CREAM; X.fillRect(0, 0, W, H);
  const wi = eio(seg(t, S.invest - .15, S.invest + .5)), wo = eio(seg(t, S.pile - .2, S.pile + .45));
  if (wi > 0 && wo < 1) {           // dairəvi wipe: nanə rəngi qrafik dünyası
    X.fillStyle = MINT; X.beginPath(); X.arc(540, 1150, 2300 * wi, 0, 7); X.fill();
    if (wo > 0) { X.fillStyle = CREAM; X.beginPath(); X.arc(540, 1100, 2300 * wo, 0, 7); X.fill(); }
  }
  for (let i = 0; i < 26; i++) {      // yumşaq üzən nöqtələr (dərinlik)
    const x = (R(i) * W + t * (8 + R(i + 9) * 18)) % W, y = (R(i + 3) * H - t * (12 + R(i + 5) * 20) + H * 4) % H;
    X.fillStyle = 'rgba(242,178,51,.16)'; X.beginPath(); X.arc(x, y, 6 + R(i + 7) * 14, 0, 7); X.fill();
  }
}
function hud(t) {
  if (t > S.coins - .2 && t < S.invest + .1) {           // DAY N · $ cəmi
    const a = spring(t - S.coins + .1) * (1 - eio(seg(t, S.invest - .25, S.invest + .05))), d = dayOf(t);
    X.save(); X.globalAlpha = clamp(a); X.translate(540, 1640); X.scale(clamp(a), clamp(a));
    X.fillStyle = '#fff'; X.beginPath(); X.roundRect(-300, -62, 600, 124, 62); X.fill();
    X.fillStyle = GREY; X.font = '40px IB'; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText('DAY ' + d, -250, 2);
    X.fillStyle = ORANGE; X.font = '62px IB'; X.textAlign = 'right'; X.fillText(money(5 * d), 250, 2); X.restore();
  }
  if (t > S.pile + 1.4 && t < S.twist + .2) {           // dağın üstündə böyük qızılı rəqəm
    const a = spring(t - S.pile - 1.5, 6, 10) * (1 - eio(seg(t, S.twist - .2, S.twist + .15)));
    X.save(); X.globalAlpha = clamp(a); X.translate(540, 640); X.scale(lerp(.5, 1, clamp(a)), lerp(.5, 1, clamp(a)));
    X.fillStyle = GOLDD; X.font = '170px IB'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(money(FV(30)), 0, 0); X.restore();
  }
  X.globalAlpha = .55; X.fillStyle = INK; X.font = '34px IM'; X.textAlign = 'center'; X.textBaseline = 'alphabetic';
  X.fillText('@constara.app', 540, 1850); X.globalAlpha = 1;
}

window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1;
  // kamera: yüngül nəfəs + vurğu anlarında silkələnmə
  const shake = T.hits.reduce((s, h) => s + Math.exp(-Math.max(0, t - h) * 14) * (t >= h ? 1 : 0), 0) * 9;
  bg(t);
  X.save(); X.translate(Math.sin(t * 61) * shake, Math.cos(t * 47) * shake);
  // S1–S3: fincan
  if (t < S.invest + .4) {
    const inA = spring(t - .05, 6, 10), outA = eio(seg(t, S.invest - .2, S.invest + .3));
    const s = clamp(inA, 0, 1.2) * (1 - outA * .6), y = 1420 + outA * 700;
    // sikkələr uçur
    for (const s0 of SP) {
      const u = (t - s0) / .45; if (u < 0 || u > 1) continue;
      const k = SP.indexOf(s0), sx = k % 2 ? 1200 : -120, sy = 700 + R(k) * 300;
      const x = lerp(sx, 540, eout(u)), yy = lerp(sy, 1000, u) - Math.sin(Math.PI * u) * 260;
      coin(x, yy, 46 * (1 - u * .5), .45 + .5 * Math.abs(Math.sin(u * 9 + k)), 1 - seg(u, .85, 1));
    }
    cup(540, y, s, t, squashAt(t) + (T.hits.includes(S.hook) ? Math.exp(-Math.max(0, t - S.hook) * 10) * (t > S.hook ? .08 : 0) : 0));
    // hook: qiymət etiketi
    const ta = spring(t - S.hook, 7, 13) * (1 - eio(seg(t, S.coins + .1, S.coins + .45)));
    if (ta > 0) {
      X.save(); X.globalAlpha = clamp(ta * 1.5); X.translate(540, 790); X.rotate(-.06 * (1 - clamp(ta)) - .04); X.scale(clamp(ta, 0, 1.3), clamp(ta, 0, 1.3));
      X.fillStyle = ORANGE; X.beginPath(); X.roundRect(-330, -95, 660, 190, 34); X.fill();
      X.fillStyle = '#fff'; X.font = '130px IB'; X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(money(FV(30) * eout(seg(t, S.hook, S.hook + .7))), 0, 6); X.restore();
    }
  }
  graph(t); pile(t);
  X.restore();
  caption(t); hud(t);
};
document.fonts.load('40px IB').then(() => document.fonts.load('40px IM')).then(() => document.fonts.ready).then(() => { window.draw(1.2); window.READY = true; });
</script></body></html>
