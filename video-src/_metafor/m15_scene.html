<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
@font-face{font-family:MO;src:url(file:///usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*TL*/
// M15 «Qum saatı»: qum yerinə rəngli lent kartları; aşağıda telefona baxan fiqur qocalır; son dənə → çevrilmə → loop.
const T = window.TL;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = 1080, H = 1920, CX = 540, CY = 1000, HH = 430, MAXW = 235, NECK = 16;
const GOLD = '#F7C04A', RED = '#FF5A4A', WHITE = '#F4F1EA';
const PAL = ['#FF4D8D', '#FF7A45', '#FFC93C', '#3DDC97', '#29C7F2', '#7B6CFF', '#C553FF', '#FF5FD2'];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eout = u => 1 - Math.pow(1 - u, 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const R = k => { let x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const prog = t => Math.pow(clamp(t / T.drain), 1.15);           // 0..1 boşalma (sona doğru sürətlənir)
const half = y => { const u = clamp(Math.abs(y) / HH); return NECK + (MAXW - NECK) * (1 - Math.pow(1 - u, 2.4)) * (1 - .22 * Math.pow(u, 6)); };
const topSurf = p => lerp(-HH + 50, -14, p);
const pileSurf = (p, x) => HH + 8 - 128 * Math.pow(p, 1.1) - 26 * p * Math.cos(clamp(Math.abs(x) / 200) * Math.PI / 2);

function glassPath() {
  X.beginPath(); X.moveTo(-half(-HH), -HH);
  for (let y = -HH; y <= HH; y += 10) X.lineTo(-half(y), y);
  for (let y = HH; y >= -HH; y -= 10) X.lineTo(half(y), y);
  X.closePath();
}
function tiles(y0, y1, surf, seed, t) {  // y0..y1 arası, surf(x) üstündən aşağı — rəngli kart toxuması
  const S = 24;
  for (let gy = Math.floor(y0 / S) * S; gy < y1; gy += S) for (let gx = -MAXW; gx < MAXW; gx += S) {
    const cx = gx + S / 2, cy = gy + S / 2; if (cy < surf(cx) - 4) continue;
    const k = (gx * 7 + gy * 13 + seed) | 0, c = PAL[Math.floor(R(k) * PAL.length)], tw = .72 + .28 * Math.sin(t * 5 + R(k + 3) * 20);
    X.globalAlpha = tw; X.fillStyle = c; X.beginPath(); X.roundRect(gx + 2, gy + 2, S - 4, S - 4, 5); X.fill();
    const ic = R(k + 9);
    if (ic < .18) { X.fillStyle = 'rgba(255,255,255,.9)'; X.beginPath(); X.moveTo(cx - 4, cy - 5); X.lineTo(cx + 6, cy); X.lineTo(cx - 4, cy + 5); X.fill(); }       // ▶
    else if (ic < .34) { X.fillStyle = 'rgba(255,255,255,.9)'; X.beginPath(); X.arc(cx - 3, cy - 2, 3.2, 0, 7); X.arc(cx + 3, cy - 2, 3.2, 0, 7); X.moveTo(cx - 6.2, cy - 1); X.lineTo(cx, cy + 6); X.lineTo(cx + 6.2, cy - 1); X.fill(); }  // ♥
  }
  X.globalAlpha = 1;
}
function seated(p, t, alpha) {  // telefona baxan oturmuş fiqur (yan görünüş), yaşlandıqca əyilir və sönür
  const s = .74, fl = HH - 8, hip = [-20, fl - 20 * s], col = `rgba(${lerp(255, 175, p) | 0},${lerp(250, 178, p) | 0},${lerp(240, 186, p) | 0},1)`;
  const lean = .12 + .55 * p, neck = [hip[0] + Math.sin(lean) * 150 * s, hip[1] - Math.cos(lean) * 150 * s];
  const head = [neck[0] + 26 * s + 10 * p, neck[1] - 36 * s + 18 * p * s];
  const knee = [hip[0] + 95 * s, hip[1] - 70 * s], foot = [hip[0] + 150 * s, fl], beat = Math.pow(1 - ((t / T.beat) % 1), 4);
  const phone = [neck[0] + 70 * s, neck[1] + 34 * s - beat * 4];
  X.save(); X.globalAlpha = alpha; X.lineCap = 'round'; X.lineJoin = 'round'; X.strokeStyle = col; X.fillStyle = col;
  X.shadowColor = `rgba(255,255,255,${.7 - .4 * p})`; X.shadowBlur = 22;
  const st = (pts, w) => { X.beginPath(); X.moveTo(...pts[0]); pts.slice(1).forEach(q => X.lineTo(...q)); X.lineWidth = w * s; X.stroke(); };
  st([hip, knee, foot], 30); st([hip, neck], 52);
  st([[neck[0], neck[1] + 20 * s], [neck[0] + 40 * s, neck[1] + 80 * s], phone], 24);
  X.beginPath(); X.arc(head[0], head[1], 38 * s, 0, 7); X.fill();
  X.shadowBlur = 0;
  // telefon + mavi işıq üzə
  X.globalCompositeOperation = 'lighter';
  let g = X.createRadialGradient(phone[0], phone[1] - 10, 2, phone[0], phone[1] - 10, 150); g.addColorStop(0, `rgba(90,200,255,${.45 + .25 * beat})`); g.addColorStop(1, 'rgba(60,120,255,0)');
  X.fillStyle = g; X.fillRect(phone[0] - 150, phone[1] - 160, 300, 300); X.globalCompositeOperation = 'source-over';
  X.save(); X.translate(phone[0], phone[1]); X.rotate(-.5); X.fillStyle = '#0c0d10'; X.fillRect(-11, -20, 22, 38);
  X.fillStyle = PAL[Math.floor(t / T.beat) % PAL.length]; X.fillRect(-8, -17, 16, 32); X.restore();
  X.fillStyle = '#15171a'; X.beginPath(); X.arc(head[0] + 17 * s, head[1] + 6 * s, 4.4 * s, 0, 7); X.fill();
  X.restore();
  return head;
}

function hourglass(t, p) {
  // dayaqlar + qapaqlar
  const cap = (y) => { let g = X.createLinearGradient(0, y - 22, 0, y + 22); g.addColorStop(0, '#FFE29A'); g.addColorStop(.5, '#C8902A'); g.addColorStop(1, '#6E4A12');
    X.fillStyle = g; X.shadowColor = 'rgba(247,192,74,.6)'; X.shadowBlur = 24; X.beginPath(); X.roundRect(-300, y - 20, 600, 40, 14); X.fill(); X.shadowBlur = 0; };
  X.strokeStyle = '#B58426'; X.lineWidth = 12; [-275, 275].forEach(x => { X.beginPath(); X.moveTo(x, -HH - 10); X.lineTo(x, HH + 10); X.stroke(); });
  // içi: kartlar (klip)
  X.save(); glassPath(); X.clip();
  let inner = X.createRadialGradient(0, 0, 20, 0, 0, 520); inner.addColorStop(0, 'rgba(120,90,255,.10)'); inner.addColorStop(1, 'rgba(20,10,40,.35)'); X.fillStyle = inner; X.fillRect(-300, -HH, 600, 2 * HH);
  const ts = topSurf(p);
  if (p < 1) tiles(ts - 30, -2, x => ts + 22 * (1 - clamp(Math.abs(x) / 120)) * Math.min(1, p * 8), 7, t);
  // axın: neckdən yığına düşən kartlar
  if (t < T.drain + .15) {
    const ytop = 0, ybot = pileSurf(p, 0);
    X.globalCompositeOperation = 'lighter'; let sg = X.createLinearGradient(0, 0, 0, ybot); sg.addColorStop(0, 'rgba(255,220,150,.5)'); sg.addColorStop(1, 'rgba(255,120,220,.15)');
    X.fillStyle = sg; X.fillRect(-7, 0, 14, ybot); X.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 26; i++) { const ph = (R(i) + t * (1.3 + R(i + 5) * .6)) % 1, y = lerp(ytop, ybot, ph * ph), x = (R(i + 2) - .5) * 18 * ph, sz = 11 + R(i + 8) * 5;
      X.fillStyle = PAL[i % PAL.length]; X.save(); X.translate(x, y); X.rotate(ph * 6 * (R(i) - .5)); X.fillRect(-sz / 2, -sz / 2, sz, sz); X.restore(); }
  }
  X.restore();
  return ts;
}

window.draw = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.shadowBlur = 0; X.letterSpacing = '0px';
  const p = prog(t), fl = ease(seg(t, T.flip, T.flip + .8)), beatK = Math.pow(1 - ((t / T.beat) % 1), 5) * (t < T.drain ? 1 : 0);
  // fon: tünd + rəngli bokeh
  let bg = X.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0A0714'); bg.addColorStop(.5, '#0B0A12'); bg.addColorStop(1, '#050408'); X.fillStyle = bg; X.fillRect(0, 0, W, H);
  X.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) { const x = (R(i) * 1300 + t * 18 * (R(i + 1) - .5) * 4) % 1300 - 110, y = R(i + 3) * 1900, r = 90 + R(i + 6) * 200;
    let g = X.createRadialGradient(x, y, 1, x, y, r); g.addColorStop(0, PAL[i % PAL.length] + '2A'); g.addColorStop(1, '#00000000'); X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r); }
  let core = X.createRadialGradient(CX, CY, 40, CX, CY, 700); core.addColorStop(0, `rgba(255,180,90,${.16 + .06 * beatK})`); core.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = core; X.fillRect(0, 0, W, H);
  X.globalCompositeOperation = 'source-over';
  // kamera: yavaş yaxınlaşma + ritm zərbəsi + çevrilmə
  const z = (1 + .05 * clamp(t / T.flip)) * (1 + .012 * beatK) * (1 - .06 * Math.sin(fl * Math.PI));
  const ghosts = fl > 0 && fl < 1 ? 3 : 1;
  for (let gI = ghosts - 1; gI >= 0; gI--) {
    let ang = Math.PI * ease(seg(t - gI * .03, T.flip, T.flip + .8));
    const swap = ang > Math.PI / 2;   // qum saatı simmetrikdir: yarıdan sonra başlanğıc vəziyyəti (p=0) çəkilir → tikişsiz loop
    if (swap) ang -= Math.PI;
    X.save(); X.translate(CX, CY); X.scale(z, z); X.rotate(ang + .012 * Math.sin(t * 1.3)); X.globalAlpha = gI ? .25 : 1;
    const pp = swap ? 0 : fl > 0 ? 1 : p;
    hourglass(t, pp);
    // yığın (alt) + fiqur
    X.save(); glassPath(); X.clip();
    const dis = seg(t, T.drain, T.flip);   // fiqur dənələrə çevrilir
    const head = seated(pp, t, swap ? 0 : (gI ? .25 : 1) * (1 - dis) * clamp(t / .2 + (t > 1 ? 1 : 0)));
    tiles(HH - 170, HH, x => pileSurf(pp, x), 3, t);
    X.restore();
    if (dis > 0 && dis < 1 && !gI && !swap) for (let i = 0; i < 40; i++) { const a = R(i) * 6.28, d = eout(dis) * (60 + R(i + 1) * 160);
      X.globalAlpha = 1 - dis; X.fillStyle = PAL[i % PAL.length]; X.fillRect(head[0] + Math.cos(a) * d - 6, head[1] + Math.sin(a) * d - 6 - dis * 80, 12, 12); }
    X.globalAlpha = gI ? .25 : 1;
    // şüşə
    glassPath(); X.lineWidth = 5; let rg = X.createLinearGradient(-MAXW, -HH, MAXW, HH); rg.addColorStop(0, 'rgba(120,220,255,.85)'); rg.addColorStop(.5, 'rgba(255,255,255,.7)'); rg.addColorStop(1, 'rgba(255,110,210,.85)');
    X.strokeStyle = rg; X.shadowColor = 'rgba(180,200,255,.8)'; X.shadowBlur = 26; X.stroke(); X.shadowBlur = 0;
    X.strokeStyle = 'rgba(255,255,255,.18)'; X.lineWidth = 10; X.beginPath(); for (let y = -HH + 40; y < -60; y += 10) X.lineTo(-half(y) + 22, y); X.stroke();
    X.beginPath(); for (let y = 60; y < HH - 40; y += 10) X.lineTo(-half(y) + 22, y); X.stroke();
    const cap = (y) => { let g = X.createLinearGradient(0, y - 22, 0, y + 22); g.addColorStop(0, '#FFE29A'); g.addColorStop(.5, '#C8902A'); g.addColorStop(1, '#6E4A12');
      X.fillStyle = g; X.shadowColor = 'rgba(247,192,74,.6)'; X.shadowBlur = 24; X.beginPath(); X.roundRect(-300, y - 20, 600, 40, 14); X.fill(); X.shadowBlur = 0; };
    cap(-HH - 18); cap(HH + 18);
    X.restore();
  }
  // son dənə: ağ parıltı + çevrilmədən sonra flaş
  const fla = Math.max(Math.exp(-Math.pow((t - T.drain) / .08, 2)) * .35, Math.exp(-Math.pow((t - T.flip - .4) / .06, 2)) * .22);
  if (fla > .01) { X.fillStyle = `rgba(255,245,230,${fla})`; X.fillRect(0, 0, W, H); }
  // sayğaclar
  const pc = t > T.flip + .4 ? 0 : p, age = Math.round(18 + 56 * pc), yrs = (9.3 * pc).toFixed(1), ca = 1 - seg(t, T.flip, T.flip + .2) + seg(t, T.flip + .45, T.flip + .7);
  const pill = (x, lab, val, col) => { X.save(); X.globalAlpha = clamp(ca); X.font = '26px MO'; X.letterSpacing = '4px'; const w1 = X.measureText(lab).width; X.font = '44px MO'; const w2 = X.measureText(val).width; const w = w1 + w2 + 64;
    X.fillStyle = 'rgba(10,8,16,.85)'; X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); X.roundRect(x - w / 2, 1528, w, 76, 38); X.fill(); X.stroke();
    X.textBaseline = 'middle'; X.font = '26px MO'; X.fillStyle = 'rgba(220,220,230,.75)'; X.fillText(lab, x - w / 2 + 26, 1567);
    X.font = '44px MO'; X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 14; X.fillText(val, x - w / 2 + 38 + w1, 1568); X.restore(); };
  pill(300, 'AGE', String(age), WHITE);
  pill(760, 'YEARS ON PHONE', yrs, pc > .6 ? RED : GOLD);
  // mətn
  for (const [a, b, txt, hi, hc] of T.texts) {
    if (t < a || t > b) continue;
    const al = Math.min(a === 0 ? 1 : seg(t, a, a + .12), 1 - seg(t, b - .12, b)), lines = txt.split('\n'), pop = a === 0 ? 1 : eout(seg(t, a, a + .22));
    X.save(); X.globalAlpha = al; X.font = '58px MO'; X.letterSpacing = '3px'; X.textBaseline = 'middle';
    lines.forEach((ln, li) => { const y = 300 + (li - (lines.length - 1) / 2) * 78; let x = W / 2 - X.measureText(ln).width / 2; const i = ln.indexOf(hi);
      const parts = i < 0 ? [[ln, WHITE]] : [[ln.slice(0, i), WHITE], [hi, hc === 'red' ? RED : GOLD], [ln.slice(i + hi.length), WHITE]];
      X.save(); X.translate(W / 2, y); X.scale(lerp(1.15, 1, pop), lerp(1.15, 1, pop)); X.translate(-W / 2, -y);
      for (const [q, c] of parts) { if (!q) continue; X.fillStyle = c; X.shadowColor = c === WHITE ? 'rgba(0,0,0,.7)' : c; X.shadowBlur = c === WHITE ? 10 : 22; X.fillText(q, x, y); x += X.measureText(q).width; }
      X.restore(); });
    X.restore();
  }
  // vinyet + dənə + imza
  let vg = X.createRadialGradient(540, 1000, 520, 540, 1000, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); X.fillStyle = vg; X.fillRect(0, 0, W, H);
  for (let i = 0; i < 600; i++) { X.fillStyle = `rgba(255,255,255,${.016 * R(i + Math.floor(t * 24) * 13)})`; X.fillRect(R(i * 3 + Math.floor(t * 24)) * W, R(i * 5 + 1 + Math.floor(t * 24)) * H, 2, 2); }
  X.save(); X.globalAlpha = .75; X.fillStyle = 'rgba(225,220,205,.9)'; X.font = '30px MO'; X.letterSpacing = '6px'; X.textAlign = 'center'; X.fillText('@constara.app', W / 2 + 3, 1790); X.restore();
};
document.fonts.ready.then(() => { window.READY = true; });
['MO', 'IB'].forEach(f => document.fonts.load('40px ' + f));
</script></body></html>
