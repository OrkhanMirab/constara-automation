// fig({body, faces:[..], hair, col:{skin,top,pants,shoes,outline,paper}, id}) → SVG sətri. Baş boyunun (n) üstünə qoyulur.
// Üz dəyişmək: figFace(id, ad). Baş əymək: #<id>head transform (boyun nöqtəsi ətrafında: figTilt(id, dərəcə)).
var FIGN = {};
function fig(o) {
  var B = POSE.body[o.body], n = B.n, col = Object.assign({ skin: '#F2C1A0', top: '#1E2533', pants: '#2B3346', shoes: '#FFFDF6', outline: '#1B1B1B', paper: '#FFFDF6' }, o.col || {});
  var hx = n[0] - 209, hy = n[1] - 445, fx = n[0] - 60, fy = n[1] - 269;
  var x0 = Math.min(0, hx - 40), y0 = hy - 40, x1 = Math.max(B.vb[2], hx + 700), y1 = B.vb[3] + 10;
  function g(list, tr) { return '<g transform="' + tr + '">' + list.map(function (p) { return '<path d="' + p[0] + '" fill="' + (col[p[1]] || col.outline) + '"/>'; }).join('') + '</g>'; }
  FIGN[o.id] = n;
  return '<svg viewBox="' + x0 + ' ' + y0 + ' ' + (x1 - x0) + ' ' + (y1 - y0) + '" style="overflow:visible"><g filter="url(#' + (o.filter || 'stkL') + ')">' + g(B.p, '') +
    '<g id="' + o.id + 'head">' + g(POSE.hair[o.hair || 'Wavy'], 'translate(' + hx + ' ' + hy + ')') +
    (o.faces || ['Calm']).map(function (f) { return '<g id="' + o.id + 'f' + f + '" style="display:none">' + g(POSE.face[f], 'translate(' + fx + ' ' + fy + ')') + '</g>'; }).join('') + '</g></g></svg>';
}
function figFace(id, f) { var e = document.querySelectorAll('[id^="' + id + 'f"]'); for (var i = 0; i < e.length; i++) e[i].style.display = e[i].id === id + 'f' + f ? 'inline' : 'none'; }
function figTilt(id, deg) { var n = FIGN[id], h = document.getElementById(id + 'head'); if (h) h.setAttribute('transform', 'rotate(' + deg + ' ' + n[0] + ' ' + n[1] + ')'); }

 if(lg)s=s.replace(/<\/g><\/svg>$/, logo(lg[0],lg[1],lg[2])+'</g></svg>'); return s;}
