<h1>Personaj: 3 tam fərqli istiqamət</h1>
<p class="s">Hər istiqamətdə eyni 3 emosiya: SEVİNC · HÜZN · CİDDİ. Detallara yox, ümumi hissə bax: hansı istiqamət «bizimki» kimi gəlir?</p>
<div id="w"></div>
<script>
const R = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const L = (X, pts) => { X.beginPath(); X.moveTo(...pts[0]); for (const p of pts.slice(1)) X.lineTo(...p); X.stroke(); };

// ---------- 1. ÜZSÜZ MİNİMAL (bədən dili) ----------
function faceless(X, emo, t) {
  const g = X.createLinearGradient(0, 0, 0, 600); g.addColorStop(0, emo === 1 ? '#22324A' : emo === 2 ? '#2A2A33' : '#2D4A5A'); g.addColorStop(1, '#141B26');
  X.fillStyle = g; X.fillRect(-170, -560, 340, 600);
  X.fillStyle = 'rgba(0,0,0,.35)'; X.save(); X.transform(1, 0, -1.2, .25, 0, 0); X.beginPath(); X.ellipse(0, 0, 60, 26, 0, 0, 7); X.fill(); X.restore();
  const skin = '#E2B08C', top = '#E9714B', pants = '#33415C', hair = '#2A2020', br = Math.sin(t * 1.7) * 3;
  X.lineCap = 'round'; X.lineJoin = 'round';
  if (emo === 1) {                         // oturub, başı aşağı
    X.strokeStyle = pants; X.lineWidth = 34; L(X, [[-20, -110], [40, -110], [40, -20]]); L(X, [[-10, -120], [52, -116], [60, -20]]);
    X.fillStyle = top; X.beginPath(); X.ellipse(-30, -190 + br, 46, 78, .5, 0, 7); X.fill();
    X.strokeStyle = top; X.lineWidth = 26; L(X, [[-10, -230 + br], [30, -150], [44, -120]]);
    X.fillStyle = skin; X.beginPath(); X.arc(16, -262 + br, 38, 0, 7); X.fill(); X.fillStyle = hair; X.beginPath(); X.arc(4, -272 + br, 40, Math.PI * .9, Math.PI * 2.1); X.fill();
    X.fillStyle = 'rgba(160,190,255,.15)'; for (let i = 0; i < 14; i++) { const y = ((t * 220 + i * 70) % 560) - 540; X.fillRect(-160 + R(i) * 320, y, 2, 18); }
  } else if (emo === 0) {                  // tullanır, qollar yuxarı
    const j = Math.abs(Math.sin(t * 3)) * 40;
    X.save(); X.translate(0, -j);
    X.strokeStyle = pants; X.lineWidth = 34; L(X, [[-14, -140], [-40, -70], [-30, -10]]); L(X, [[14, -140], [44, -80], [60, -30]]);
    X.fillStyle = top; X.beginPath(); X.roundRect(-46, -290, 92, 160, 40); X.fill();
    X.strokeStyle = top; X.lineWidth = 26; L(X, [[-36, -270], [-80, -330], [-96, -400]]); L(X, [[36, -270], [80, -330], [94, -404]]);
    X.fillStyle = skin; X.beginPath(); X.arc(-98, -412, 16, 0, 7); X.arc(96, -416, 16, 0, 7); X.fill();
    X.beginPath(); X.arc(0, -334, 40, 0, 7); X.fill(); X.fillStyle = hair; X.beginPath(); X.arc(0, -346, 42, Math.PI * .95, Math.PI * 2.05); X.fill();
    X.restore();
    X.fillStyle = '#F7C04A'; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28 + t, r = 150 + Math.sin(t * 4 + i) * 20; X.fillRect(Math.cos(a) * r, -300 + Math.sin(a) * r * .7, 8, 8); }
  } else {                                  // dik durur, irəli baxır, yumruq
    X.strokeStyle = pants; X.lineWidth = 34; L(X, [[-18, -150], [-24, -80], [-28, -10]]); L(X, [[18, -150], [26, -80], [34, -10]]);
    X.fillStyle = top; X.beginPath(); X.roundRect(-50, -310 + br, 100, 175, 40); X.fill();
    X.strokeStyle = top; X.lineWidth = 26; L(X, [[-42, -290 + br], [-58, -220], [-56, -160]]); L(X, [[42, -290 + br], [58, -220], [56, -160]]);
    X.fillStyle = skin; X.beginPath(); X.arc(-56, -150, 17, 0, 7); X.arc(56, -150, 17, 0, 7); X.fill();
    X.beginPath(); X.arc(0, -350 + br, 40, 0, 7); X.fill(); X.fillStyle = hair; X.beginPath(); X.arc(0, -362 + br, 42, Math.PI * .95, Math.PI * 2.05); X.fill();
    X.strokeStyle = 'rgba(255,255,255,.12)'; X.lineWidth = 3; for (let i = 0; i < 6; i++) L(X, [[-150, -480 + i * 60], [150, -500 + i * 60]]);
  }
}

// ---------- 2. HEYVAN MASKOT (pişik) ----------
function cat(X, emo, t) {
  const bg = ['#3B2A4A', '#1F2A3D', '#2A2F2A'][emo]; X.fillStyle = bg; X.fillRect(-170, -560, 340, 600);
  const O = '#F08A3C', OD = '#C96A26', CR = '#FBE6CC', INK = '#2A1A14', br = Math.sin(t * 1.7) * 3, blink = (t % 3.2) < .12;
  X.lineWidth = 6; X.strokeStyle = INK; X.lineJoin = 'round'; X.lineCap = 'round';
  // quyruq
  X.strokeStyle = O; X.lineWidth = 26; X.beginPath(); X.moveTo(70, -40); X.quadraticCurveTo(160, -60 + (emo === 1 ? 40 : -60 * Math.sin(t * 3)), 120, -180 + (emo === 1 ? 140 : 0)); X.stroke();
  X.strokeStyle = INK; X.lineWidth = 6;
  // bədən (oturur)
  X.fillStyle = O; X.beginPath(); X.ellipse(0, -110 + br, 100, 115, 0, 0, 7); X.fill(); X.stroke();
  X.fillStyle = CR; X.beginPath(); X.ellipse(0, -90 + br, 56, 80, 0, 0, 7); X.fill();
  X.fillStyle = O; for (const s of [-1, 1]) { X.beginPath(); X.ellipse(s * 46, -6, 34, 20, 0, 0, 7); X.fill(); X.stroke(); }
  // baş

// ---------- 3. ƏL İLƏ ÇƏKİLMİŞ DÜDL (qələm xətti, tünd dəftər) ----------
function wl(X, pts, seed, amp = 2.5) { X.beginPath(); pts.forEach((p, i) => { const j = (R(i + seed) - .5) * amp * 2; i ? X.lineTo(p[0] + j, p[1] - j) : X.moveTo(p[0] + j, p[1] + j); }); X.stroke(); }

    wl(X, [[0, -190], [40, -120], [50, -100]], fr + 9); }
  else if (emo === 0) { const j = Math.abs(Math.sin(t * 3)) * 30; X.translate(0, -j);
    wl(X, [[-20, -140], [-40, -70], [-30, -10]], fr); wl(X, [[20, -140], [40, -70], [50, -20]], fr + 3);
    wl(X, [[-40, -260], [-90, -330], [-100, -390]], fr + 6); wl(X, [[40, -260], [90, -330], [96, -394]], fr + 8); }
  else { wl(X, [[-20, -140], [-24, -70], [-28, -10]], fr); wl(X, [[20, -140], [26, -70], [32, -10]], fr + 3);

    wl(X, [[hx - 16, hy + 14], [hx, hy + 26], [hx + 16, hy + 14]], fr + 2); }
  else if (emo === 1) { X.beginPath(); X.arc(hx - 12, hy + 6, 4, 0, 7); X.arc(hx + 14, hy + 6, 4, 0, 7); X.fill();
    wl(X, [[hx - 22, hy - 12], [hx - 6, hy - 6]], fr); wl(X, [[hx + 24, hy - 12], [hx + 8, hy - 6]], fr + 1); wl(X, [[hx - 10, hy + 26], [hx, hy + 22], [hx + 10, hy + 26]], fr + 2);
    X.strokeStyle = 'rgba(140,200,255,.8)'; const u = (t * .6) % 1; wl(X, [[hx - 12, hy + 14 + u * 30], [hx - 12, hy + 22 + u * 30]], fr); }
  else { X.beginPath(); X.arc(hx - 12, hy, 4, 0, 7); X.arc(hx + 14, hy, 4, 0, 7); X.fill();
    wl(X, [[hx - 24, hy - 16], [hx - 4, hy - 10]], fr); wl(X, [[hx + 26, hy - 16], [hx + 6, hy - 10]], fr + 1); wl(X, [[hx - 10, hy + 22], [hx + 10, hy + 22]], fr + 2); }
}

const DIRS = [
